<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Trip.com Admin | Control Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'Inter';
            src: url('Inter-VariableFont_opsz,wght.ttf') format('truetype');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Inter';
            src: url('Inter-Italic-VariableFont_opsz,wght.ttf') format('truetype');
            font-weight: 100 900;
            font-style: italic;
            font-display: swap;
        }

        :root {
            --primary: #1a1a2e;
            --secondary: #2d6a4f;
            --secondary-light: #409f7a;
            --bg: #f8f9fa;
            --bg-card: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #4a4a5a;
            --muted: #8a8a9a;
            --border: rgba(26,26,46,0.08);
            --shadow: 0 4px 24px rgba(26,26,46,0.06);
            --shadow-hover: 0 8px 40px rgba(26,26,46,0.10);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            font-family:'Inter', sans-serif;
            background:var(--bg);
            color:var(--text);
            min-height:100vh;
            overflow-y:auto;
            -webkit-font-smoothing:antialiased;
        }
        .admin-wrap { display:flex; min-height:100vh; }
        .sidebar {
            width:220px;
            background:var(--bg-card);
            border-right:1px solid var(--border);
            padding:16px 10px;
            overflow-y:auto;
            display:flex;
            flex-direction:column;
            flex-shrink:0;
            height:100vh;
            position:sticky; top:0;
            box-shadow:var(--shadow);
        }
        .sidebar::-webkit-scrollbar { width:3px; }
        .sidebar::-webkit-scrollbar-track { background:transparent; }
        .sidebar::-webkit-scrollbar-thumb { background:var(--secondary); border-radius:10px; }
        .sidebar-brand {
            display:flex;
            align-items:center;
            gap:10px;
            padding:0 6px 14px 6px;
            border-bottom:1px solid var(--border);
            margin-bottom:10px;
        }
        .logo-plane {
            width:38px; height:38px;
            background:var(--secondary);
            border-radius:12px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:18px;
            color:#fff;
            box-shadow:0 4px 15px rgba(45,106,79,0.12);
            flex-shrink:0;
        }
        .logo-text-name {
            font-size:20px;
            font-weight:800;
            color:var(--primary);
            letter-spacing:-0.5px;
        }
        .sidebar-brand .dot {
            width:6px; height:6px;
            background:#10b981;
            border-radius:50%;
            display:inline-block;
            animation:pulse 1.5s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }
        .nav-item {
            padding:8px 12px;
            margin:1px 0;
            border-radius:10px;
            cursor:pointer;
            color:var(--text-secondary);
            transition:var(--transition);
            display:flex;
            align-items:center;
            gap:10px;
            font-weight:500;
            font-size:13px;
            border-left:2px solid transparent;
        }
        .nav-item:hover { background:rgba(45,106,79,0.02); color:var(--text); }
        .nav-item.active {
            color:var(--secondary);
            background:rgba(45,106,79,0.04);
            border-left-color:var(--secondary);
        }
        .nav-item i { width:18px; text-align:center; font-size:14px; color:var(--muted); }
        .nav-item.active i { color:var(--secondary); }
        .nav-item .count {
            margin-left:auto;
            background:rgba(45,106,79,0.06);
            padding:0 8px;
            border-radius:30px;
            font-size:9px;
            color:var(--secondary);
            font-weight:600;
        }
        .nav-divider { border:none; border-top:1px solid var(--border); margin:8px 0; }
        .main { flex:1; padding:16px 20px; overflow-y:auto; background:var(--bg); }
        .main::-webkit-scrollbar { width:4px; }
        .main::-webkit-scrollbar-track { background:transparent; }
        .main::-webkit-scrollbar-thumb { background:var(--secondary); border-radius:10px; }
        .card-glass {
            background:var(--bg-card);
            border-radius:var(--radius);
            padding:16px;
            margin-bottom:14px;
            border:1px solid var(--border);
            box-shadow:var(--shadow);
            transition:var(--transition);
        }
        .card-glass:hover { border-color:rgba(45,106,79,0.12); box-shadow:var(--shadow-hover); }
        .card-glass .title { font-size:17px; font-weight:700; color:var(--primary); margin-bottom:12px; display:flex; align-items:center; gap:8px; }
        .card-glass .title i { font-size:15px; color:var(--secondary); }
        .btn-primary {
            background:var(--secondary);
            border:none;
            padding:6px 16px;
            border-radius:40px;
            font-weight:600;
            color:#fff;
            cursor:pointer;
            transition:var(--transition);
            font-size:12px;
            box-shadow:0 4px 15px rgba(45,106,79,0.1);
            display:inline-flex;
            align-items:center;
            gap:5px;
        }
        .btn-primary:hover { background:var(--secondary-light); transform:translateY(-1px); box-shadow:0 6px 25px rgba(45,106,79,0.18); }
        .btn-primary:active { transform:scale(0.97); }
        .btn-primary-sm { padding:4px 12px; font-size:11px; }
        .btn-outline { background:transparent; border:1px solid var(--border); color:var(--text-secondary); padding:5px 14px; border-radius:40px; cursor:pointer; transition:var(--transition); font-size:12px; display:inline-flex; align-items:center; gap:5px; }
        .btn-outline:hover { border-color:var(--secondary); color:var(--secondary); background:rgba(45,106,79,0.02); }
        .btn-danger { background:#dc2626; color:#fff; border:none; }
        .btn-success { background:#10b981; color:#fff; border:none; }
        .btn-google {
            background:#ffffff;
            border:1px solid var(--border);
            color:var(--text-secondary);
            padding:12px 24px;
            border-radius:40px;
            font-weight:600;
            cursor:pointer;
            transition:var(--transition);
            font-size:14px;
            width:100%;
            text-align:center;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:10px;
            box-shadow:var(--shadow);
            margin-top:8px;
        }
        .btn-google:hover { border-color:var(--secondary); color:var(--text); transform:translateY(-1px); box-shadow:var(--shadow-hover); }
        .btn-google i { font-size:20px; color:#EA4335; }
        .input-glass {
            background:var(--bg);
            border:1px solid var(--border);
            padding:7px 12px;
            border-radius:10px;
            color:var(--text);
            width:100%;
            font-size:13px;
            outline:none;
            transition:var(--transition);
        }
        .input-glass:focus { border-color:var(--secondary); box-shadow:0 0 0 3px rgba(45,106,79,0.06); }
        .input-glass::placeholder { color:var(--muted); }
        select.input-glass { appearance:none; }
        textarea.input-glass { resize:vertical; min-height:50px; }
        .pw-wrap { position:relative; }
        .pw-wrap .input-glass { padding-right:40px; }
        .pw-toggle { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--secondary); cursor:pointer; font-size:14px; }
        .table-wrap { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; font-size:13px; }
        th { text-align:left; padding:8px 6px; color:var(--text-secondary); font-weight:600; border-bottom:1px solid var(--border); }
        td { padding:8px 6px; border-bottom:1px solid rgba(26,26,46,0.02); vertical-align:middle; }
        tr:hover td { background:rgba(45,106,79,0.01); }
        .badge-status { padding:2px 10px; border-radius:30px; font-size:9px; font-weight:600; display:inline-block; }
        .badge-pending { background:rgba(245,158,11,0.08); color:#f59e0b; border:1px solid rgba(245,158,11,0.12); }
        .badge-approved { background:rgba(16,185,129,0.08); color:#10b981; border:1px solid rgba(16,185,129,0.12); }
        .badge-rejected { background:rgba(220,38,38,0.08); color:#dc2626; border:1px solid rgba(220,38,38,0.12); }
        .badge-active { background:rgba(16,185,129,0.08); color:#10b981; border:1px solid rgba(16,185,129,0.12); }
        .badge-inactive { background:rgba(220,38,38,0.08); color:#dc2626; border:1px solid rgba(220,38,38,0.12); }
        .badge-online { background:rgba(16,185,129,0.08); color:#10b981; border:1px solid rgba(16,185,129,0.12); }
        .badge-offline { background:var(--bg); color:var(--muted); border:1px solid var(--border); }
        .vip-1 { background:#e8e8ed; color:var(--text-secondary); padding:2px 8px; border-radius:20px; font-size:9px; font-weight:700; display:inline-block; }
        .vip-2 { background:#d4edda; color:#1e7e34; }
        .vip-3 { background:#cce5ff; color:#0f6b7a; }
        .vip-4 { background:linear-gradient(135deg,#D4AF37,#F5E7B2); color:#0a120e; }
        .inj-item { background:var(--bg); padding:8px 12px; border-radius:10px; margin-bottom:6px; border-left:3px solid var(--secondary); transition:var(--transition); }
        .inj-item:hover { background:rgba(45,106,79,0.02); }
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(26,26,46,0.5); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; z-index:2000; padding:16px; }
        .modal-box { background:var(--bg-card); border-radius:var(--radius); padding:20px; width:92%; max-width:480px; max-height:85vh; overflow-y:auto; border:1px solid var(--secondary); box-shadow:var(--shadow-hover); }
        .modal-box .modal-title { font-size:17px; font-weight:700; color:var(--primary); margin-bottom:12px; display:flex; align-items:center; gap:8px; }
        .modal-box .modal-title i { color:var(--secondary); }
        .chat-wrap { display:flex; flex-direction:column; height:50vh; background:var(--bg); border-radius:var(--radius); overflow:hidden; border:1px solid var(--border); }
        .chat-msgs { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:5px; }
        .chat-msg { max-width:80%; padding:6px 12px; border-radius:14px; font-size:13px; line-height:1.4; word-break:break-word; }
        .chat-msg.sent { align-self:flex-end; background:var(--secondary); color:#fff; border-bottom-right-radius:3px; }
        .chat-msg.received { align-self:flex-start; background:var(--bg); border:1px solid var(--border); border-bottom-left-radius:3px; }
        .chat-msg .time { font-size:8px; opacity:0.4; margin-top:2px; text-align:right; }
        .chat-msg img { max-width:120px; max-height:80px; border-radius:6px; margin-top:3px; border:1px solid var(--secondary); cursor:pointer; }
        .chat-input { display:flex; gap:5px; padding:8px 10px; background:var(--bg-card); border-top:1px solid var(--border); align-items:center; }
        .chat-input .input-glass { margin:0; flex:1; padding:6px 12px; font-size:12px; min-height:34px; }
        .chat-input .btn-primary { width:auto; padding:6px 16px; font-size:12px; min-height:34px; }
        @media(max-width:768px) {
            .sidebar { width:100%; max-height:48px; flex-direction:row; overflow-x:auto; padding:4px 8px; border-right:none; border-bottom:1px solid var(--border); height:auto; position:relative; }
            .sidebar-brand { display:none; }
            .nav-item { white-space:nowrap; margin:0 2px; padding:4px 8px; font-size:11px; flex-shrink:0; border-left:none; }
            .nav-item .count { display:none; }
            .main { padding:10px; }
            .card-glass { padding:12px; }
            .modal-box { padding:14px; }
        }
        @media(max-width:480px) {
            .main { padding:6px; }
            .card-glass { padding:8px; }
            .table-wrap { font-size:11px; }
            th, td { padding:4px 3px; }
            .btn-primary { font-size:10px; padding:4px 10px; }
        }
        .login-screen { position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:3000; }
        .login-box { background:var(--bg-card); padding:28px; border-radius:24px; width:380px; max-width:92%; border:1px solid var(--secondary); box-shadow:var(--shadow-hover); }
        .login-box .brand { text-align:center; margin-bottom:20px; }
        .login-box .brand .logo-plane { width:60px; height:60px; background:var(--secondary); border-radius:16px; display:flex; align-items:center; justify-content:center; margin:0 auto 8px; font-size:26px; color:#fff; box-shadow:0 4px 25px rgba(45,106,79,0.1); }
        .login-box .brand .name { font-size:28px; font-weight:800; color:var(--primary); }
        .login-box .brand .sub { font-size:12px; color:var(--muted); }
        .login-box .input-glass { margin-bottom:10px; }
        .login-box .btn-primary { width:100%; padding:10px; justify-content:center; }
        .login-box .error { color:#dc2626; text-align:center; margin-top:8px; font-size:12px; }
        .toast-msg { position:fixed; bottom:76px; left:50%; transform:translateX(-50%); background:var(--primary); padding:6px 18px; border-radius:40px; font-size:11px; z-index:100; font-weight:600; color:#fff; box-shadow:0 4px 20px rgba(26,26,46,0.15); max-width:92%; text-align:center; }
        .toast-msg.error { background:#dc2626; }
        .live-indicator { position:fixed; bottom:20px; right:16px; background:rgba(16,185,129,0.8); color:#fff; padding:2px 10px; border-radius:30px; font-size:8px; z-index:100; animation:pulse 1.5s infinite; display:none; }
        .flex { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; }
        .gap-1 { gap:4px; }
        .mt-1 { margin-top:6px; }
        .mb-1 { margin-bottom:6px; }
        .text-muted { color:var(--muted); }
        .text-center { text-align:center; }
        .w-full { width:100%; }
        .img-preview { max-width:70px; max-height:70px; border-radius:6px; border:1px solid var(--secondary); cursor:pointer; }
        .img-preview-sm { max-width:50px; max-height:50px; border-radius:4px; border:1px solid var(--secondary); cursor:pointer; }
        .online-dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:4px; }
        .online-dot.online { background:#10b981; animation:pulse 1.5s infinite; }
        .online-dot.offline { background:var(--muted); }
        ::-webkit-scrollbar { width:3px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:var(--secondary); border-radius:10px; }
        .spinner-circle {
            display:inline-block;
            width:20px;
            height:20px;
            border:2px solid rgba(255,255,255,0.3);
            border-radius:50%;
            border-top-color:#fff;
            animation:spin 0.8s linear infinite;
            vertical-align:middle;
            margin-right:6px;
        }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
    </style>
</head>
<body>

<div id="loginScreen" class="login-screen">
    <div class="login-box">
        <div class="brand">
            <div class="logo-plane"><i class="fas fa-plane"></i></div>
            <div class="name">Trip.com</div>
            <div class="sub">Admin Panel</div>
        </div>
        <input type="text" class="input-glass" id="loginUser" placeholder="Username">
        <div class="pw-wrap">
            <input type="password" class="input-glass" id="loginPass" placeholder="Password">
            <button class="pw-toggle" id="loginToggle"><i class="fas fa-eye"></i></button>
        </div>
        <button class="btn-primary" id="loginBtn"><i class="fas fa-arrow-right-to-bracket"></i> Login</button>
        <div style="position:relative;margin:16px 0 8px;width:100%;">
            <div style="border-top:1px solid var(--border);position:absolute;top:50%;left:0;right:0;"></div>
            <span style="background:var(--bg-card);position:relative;padding:0 12px;color:var(--muted);font-size:11px;">or</span>
        </div>
        <button class="btn-google" id="loginGoogleBtn"><i class="fab fa-google"></i> Sign in with Google</button>
        <div id="loginError" class="error"></div>
    </div>
</div>

<div id="adminPanel" style="display:none;">
    <div class="admin-wrap">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <div class="logo-plane"><i class="fas fa-plane"></i></div>
                <div class="logo-text-name">Trip.com</div>
                <span class="dot"></span>
            </div>
            <div class="nav-item active" data-section="dashboard"><i class="fas fa-chart-pie"></i> Dashboard</div>
            <div class="nav-item" data-section="members"><i class="fas fa-users"></i> Members <span class="count" id="memberCount">0</span></div>
            <div class="nav-item" data-section="vip"><i class="fas fa-star"></i> VIP</div>
            <div class="nav-item" data-section="injection"><i class="fas fa-syringe"></i> Injection</div>
            <div class="nav-item" data-section="orders"><i class="fas fa-plus-circle"></i> Orders</div>
            <div class="nav-item" data-section="recharge"><i class="fas fa-coins"></i> Recharge</div>
            <div class="nav-item" data-section="withdraw"><i class="fas fa-hand-holding-usd"></i> Withdraw</div>
            <div class="nav-item" data-section="loans"><i class="fas fa-hand-holding-heart"></i> Loans</div>
            <div class="nav-item" data-section="agency"><i class="fas fa-user-tie"></i> Agencies</div>
            <div class="nav-item" data-section="settings"><i class="fas fa-paint-brush"></i> Settings</div>
            <div class="nav-item" data-section="popup"><i class="fas fa-ad"></i> Popup Ads</div>
            <div class="nav-item" data-section="chat"><i class="fas fa-comment-dots"></i> Chat</div>
            <div class="nav-item" data-section="notifications"><i class="fas fa-bell"></i> Send Notification</div>
            <hr class="nav-divider">
            <div class="nav-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Sign Out</div>
        </div>
        <div class="main" id="mainContent"></div>
    </div>
</div>

<div class="live-indicator" id="liveIndicator"><i class="fas fa-circle"></i> Live</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, getDoc, getDocs, query, where, updateDoc, deleteDoc, onSnapshot, orderBy, limit, getCountFromServer } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut as firebaseSignOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDm1FBPzFsnYsdgwlK6WNWFz3POuOL-pHs",
        authDomain: "tiktok-shop2026.firebaseapp.com",
        projectId: "tiktok-shop2026",
        storageBucket: "tiktok-shop2026.firebasestorage.app",
        messagingSenderId: "319316492310",
        appId: "1:319316492310:web:b6b4969543d00b993eb537"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    // ===== GLOBALS =====
    let admin = null;
    let currentSection = 'dashboard';
    let unsubscribers = {}; // store unsubscribe functions per section
    let cachedData = {
        users: [],
        agencies: [],
        injections: [],
        customOrders: [],
        rechargeReqs: [],
        withdrawReqs: [],
        loanReqs: [],
        popupAds: [],
        systemSettings: { usdtWalletAddress: 'TCfRPvLHWkRCpaqyVkF2xaHTzqsrVr9oMf', minBalanceForOrder: 10 }
    };

    function esc(s) { if(!s) return ''; return s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]||m); }
    function toast(msg, err=false) {
        const el = document.createElement('div');
        el.className = `toast-msg${err ? ' error' : ''}`;
        el.innerHTML = `<i class="fas ${err ? 'fa-exclamation-triangle' : 'fa-circle-check'}"></i> ${msg}`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2200);
    }
    function showLoader() {
        const l = document.createElement('div');
        l.id = 'loader';
        l.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(26,26,46,0.4);display:flex;align-items:center;justify-content:center;z-index:9999;backdrop-filter:blur(2px);font-size:18px;color:var(--secondary);';
        l.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Loading...';
        document.body.appendChild(l);
        setTimeout(() => { const el = document.getElementById('loader'); if(el) el.remove(); }, 500);
    }
    function getVIP(balance) {
        if (balance >= 1500) return 4;
        if (balance >= 500) return 3;
        if (balance >= 100) return 2;
        return 1;
    }
    function getVipClass(lv) {
        return lv===1?'vip-1':lv===2?'vip-2':lv===3?'vip-3':'vip-4';
    }
    function togglePw(id, btn) {
        const inp = document.getElementById(id);
        const icon = btn.querySelector('i');
        if (inp.type === 'password') { inp.type='text'; icon.classList.replace('fa-eye','fa-eye-slash'); }
        else { inp.type='password'; icon.classList.replace('fa-eye-slash','fa-eye'); }
    }
    window.togglePw = togglePw;

    // ===== AUTH =====
    async function login(username, password) {
        // Check agencies
        const a = cachedData.agencies.find(x => x.username === username && x.password === password && x.status === 'active');
        if (a) return { success:true, data:a, role:'agency', perms:a.permissions||{} };
        if (username === 'admin' && password === 'admin123') return { success:true, data:{id:'admin',username:'admin'}, role:'admin', perms:{all:true} };
        if (username === 'hein' && password === '123456') return { success:true, data:{id:'master',username:'hein'}, role:'master', perms:{all:true} };
        // Check admin users collection
        const q = query(collection(db,'users'), where('username','==',username), where('role','==','admin'));
        const snap = await getDocs(q);
        if (!snap.empty) {
            const d = snap.docs[0].data();
            if (d.password === password) return { success:true, data:{id:snap.docs[0].id,...d}, role:'admin', perms:{all:true} };
        }
        return { success:false };
    }

    async function handleGoogleLogin() {
        try {
            const result = await signInWithPopup(auth, googleProvider);
            const gUser = result.user;
            const email = gUser.email;
            const q = query(collection(db,'users'), where('email','==',email), where('role','==','admin'));
            const snap = await getDocs(q);
            if (!snap.empty) {
                const d = snap.docs[0].data();
                admin = { id: snap.docs[0].id, username: d.username, role: 'admin', perms: {all:true}, loginTime: Date.now() };
                sessionStorage.setItem('adminSession', JSON.stringify(admin));
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadBaseData();
                renderSection('dashboard');
                toast(`Welcome Admin, ${admin.username}`);
            } else {
                toast('This Google account is not registered as an Admin.', true);
            }
        } catch (error) {
            console.error("Google Login Error:", error);
            toast("Google Login failed: " + error.message, true);
        }
    }

    function checkSession() {
        const s = sessionStorage.getItem('adminSession');
        if (s) {
            const d = JSON.parse(s);
            if (Date.now() - d.loginTime < 24*60*60*1000) {

    // ===== DATA LOADING (ON-DEMAND with unsubscribe) =====
    function loadBaseData() {
        // Load settings once
        getDoc(doc(db,'systemSettings','main')).then(snap => {
            if (snap.exists()) cachedData.systemSettings = snap.data();
        }).catch(console.error);
        // Load agencies once (for login and display)
        getDocs(collection(db,'agencies')).then(snap => {
            cachedData.agencies = []; snap.forEach(d => cachedData.agencies.push({ id:d.id, ...d.data() }));
        }).catch(console.error);
        // Load custom orders once
        getDocs(collection(db,'customOrders')).then(snap => {
            cachedData.customOrders = []; snap.forEach(d => cachedData.customOrders.push({ id:d.id, ...d.data() }));
        }).catch(console.error);
        // Load popup ads once
        getDocs(collection(db,'popupAds')).then(snap => {
            cachedData.popupAds = []; snap.forEach(d => cachedData.popupAds.push({ id:d.id, ...d.data() }));
        }).catch(console.error);
    }

    function loadSectionData(section) {
        // Unsubscribe previous listeners for this section
        if (unsubscribers[section]) {
            unsubscribers[section]();
            delete unsubscribers[section];
        }

        switch(section) {
            case 'dashboard':
            case 'members':
            case 'vip':
            case 'injection':
                // Users - used in multiple sections; we'll keep a single listener for users
                if (!unsubscribers['users']) {
                    unsubscribers['users'] = onSnapshot(query(collection(db,'users'), limit(500)), (snap) => {
                        cachedData.users = [];
                        snap.forEach(d => cachedData.users.push({ id:d.id, ...d.data() }));
                        // Update member count
                        const total = cachedData.users.filter(u => u.role !== 'admin' && u.role !== 'agency').length;
                        document.getElementById('memberCount').textContent = total;
                        // If current section uses users, re-render
                        if (['dashboard','members','vip','injection'].includes(currentSection)) {
                            renderSection(currentSection);
                        }
                        // Live indicator
                        const ind = document.getElementById('liveIndicator');
                        ind.style.display = 'flex';
                        setTimeout(() => { ind.style.display = 'none'; }, 1200);
                    });
                }
                break;
            case 'recharge':
                if (!unsubscribers['recharge']) {
                    unsubscribers['recharge'] = onSnapshot(query(collection(db,'rechargeRequests'), orderBy('timestamp','desc'), limit(200)), (snap) => {
                        cachedData.rechargeReqs = [];
                        snap.forEach(d => cachedData.rechargeReqs.push({ id:d.id, ...d.data() }));
                        if (currentSection === 'recharge') renderSection('recharge');
                    });
                }
                break;
            case 'withdraw':
                if (!unsubscribers['withdraw']) {
                    unsubscribers['withdraw'] = onSnapshot(query(collection(db,'withdrawRequests'), orderBy('timestamp','desc'), limit(200)), (snap) => {
                        cachedData.withdrawReqs = [];
                        snap.forEach(d => cachedData.withdrawReqs.push({ id:d.id, ...d.data() }));
                        if (currentSection === 'withdraw') renderSection('withdraw');
                    });
                }
                break;
            case 'loans':
                if (!unsubscribers['loans']) {
                    unsubscribers['loans'] = onSnapshot(query(collection(db,'loanRequests'), orderBy('timestamp','desc'), limit(200)), (snap) => {
                        cachedData.loanReqs = [];
                        snap.forEach(d => cachedData.loanReqs.push({ id:d.id, ...d.data() }));
                        if (currentSection === 'loans') renderSection('loans');
                    });
                }
                break;
            case 'injection':
                // For injection, we need injections list; we can use a separate listener or fetch on demand
                // We'll use onSnapshot for injections as well
                if (!unsubscribers['injections']) {
                    unsubscribers['injections'] = onSnapshot(collection(db,'injections'), (snap) => {
                        cachedData.injections = [];
                        snap.forEach(d => cachedData.injections.push({ id:d.id, ...d.data() }));
                        if (currentSection === 'injection') renderSection('injection');
                    });
                }
                break;
            // Others: agencies, customOrders, popupAds already loaded once; chat uses its own listener
            default:
                break;
        }
    }

    // ===== RENDER FUNCTIONS =====
    function renderSection(section) {
        currentSection = section;
        localStorage.setItem('adminSection', section);
        document.querySelectorAll('.nav-item').forEach(el => {
            el.classList.toggle('active', el.dataset.section === section);
        });
        // Load data for this section if not already loaded
        loadSectionData(section);
        const main = document.getElementById('mainContent');
        switch(section) {
            case 'dashboard': renderDashboard(main); break;
            case 'members': renderMembers(main); break;
            case 'vip': renderVIP(main); break;
            case 'injection': renderInjection(main); break;
            case 'orders': renderOrders(main); break;
            case 'recharge': renderRecharge(main); break;
            case 'withdraw': renderWithdraw(main); break;
            case 'loans': renderLoans(main); break;
            case 'agency': renderAgency(main); break;
            case 'settings': renderSettings(main); break;
            case 'popup': renderPopup(main); break;
            case 'chat': renderChat(main); break;
            case 'notifications': renderNotifications(main); break;
            default: main.innerHTML = '<div class="card-glass"><p>Section not found</p></div>';
        }
    }

    window.setupOrder = async (id) => {
        const u = cachedData.users.find(x => x.id === id);
        if (!u) return;
        const c = parseInt(prompt('Add/remove orders (+/-):', 0));
        if (!isNaN(c)) {
            if (!u.tasks) u.tasks = { completed:0, total:0 };
            if (c > 0) u.tasks.total += c;
            else if (c < 0) {
                const r = Math.abs(c);
                if (u.tasks.total >= r) { u.tasks.total -= r; if (u.tasks.completed > u.tasks.total) u.tasks.completed = u.tasks.total; }
            }
            await updateDoc(doc(db,'users',id), { tasks: u.tasks });
            toast('Orders updated');
            renderSection('members');
        }
    };
    window.setupBalance = async (id) => {
        const u = cachedData.users.find(x => x.id === id);
        if (!u) return;
        const b = prompt('New balance:', u.balance);

    // ---- CHAT ----
    function renderChat(main) {
        const customers = cachedData.users.filter(u => u.role !== 'admin' && u.role !== 'agency' && !u.disabled);
        main.innerHTML = `
            <div class="card-glass">
                <div class="title"><i class="fas fa-comment-dots"></i> Customer Chat</div>
                <select class="input-glass" id="chatSelect" style="margin-bottom:6px;">
                    <option value="">-- Select Customer --</option>
                    ${customers.map(u => `<option value="${esc(u.username)}">${esc(u.username)} (${u.email||''})</option>`).join('')}
                </select>
                <div class="chat-wrap">
                    <div class="chat-msgs" id="chatMsgs"></div>
                    <div class="chat-input">
                        <input type="text" class="input-glass" id="chatInput" placeholder="Type..." style="margin:0;flex:1;padding:6px 12px;font-size:12px;min-height:34px;">
                        <button class="btn-primary" id="chatSend" style="width:auto;padding:6px 16px;font-size:12px;min-height:34px;">Send</button>
                    </div>
                </div>
            </div>
        `;
        let chatUnsub = null;
        document.getElementById('chatSelect').onchange = function() {
            const chatUser = this.value;
            if (chatUnsub) { chatUnsub(); chatUnsub = null; }
            const container = document.getElementById('chatMsgs');
            if (!chatUser) { container.innerHTML = '<div style="text-align:center;padding:10px;color:var(--muted);">Select a customer</div>'; return; }
            container.innerHTML = '<div style="text-align:center;padding:10px;color:var(--muted);">Loading...</div>';
            const q = query(collection(db,'chatMessages'), orderBy('id','asc'));
            chatUnsub = onSnapshot(q, (snap) => {
                if (!container || !chatUser) return;
                const msgs = [];
                snap.forEach(d => {
                    const m = d.data();
                    if (m.type !== 'notification' && ((m.from === chatUser && m.to === 'admin') || (m.from === 'admin' && m.to === chatUser))) {
                        msgs.push(m);
                    }
                });
                msgs.sort((a,b) => a.id - b.id);
                container.innerHTML = msgs.length ? msgs.map(m => `
                    <div class="chat-msg ${m.from === 'admin' ? 'sent' : 'received'}">
                        <div>${esc(m.text||'')}</div>
                        ${m.image ? `<img src="${m.image}" onclick="window.open(this.src)">` : ''}
                        <div class="time">${m.time ? new Date(m.time).toLocaleString([], { hour12: false }) : ''}</div>
                    </div>
                `).join('') : '<div style="text-align:center;padding:10px;color:var(--muted);">No messages</div>';
                container.scrollTop = container.scrollHeight;
            });
        };
        document.getElementById('chatSend').onclick = async () => {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            const chatUser = document.getElementById('chatSelect').value;
            if (!text || !chatUser) { if (!chatUser) toast('Select customer', true); return; }
            await setDoc(doc(db,'chatMessages',(Date.now()+Math.random()).toString()), {
                id: Date.now()+Math.random(),
                from: 'admin',
                to: chatUser,
                text: text,
                image: null,
                time: new Date().toISOString(),
                read: false,
                type: 'message'
            });
            input.value = '';
            input.focus();
        };
        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('chatSend').click();
        });
        // Store unsub for cleanup
        window.__chatUnsub = chatUnsub;
    }

                return;
            }
            const btn = document.getElementById('sendNotifBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Sending...';
            document.getElementById('notifStatus').innerHTML = '';
            try {
                const targets = username === 'all' 
                    ? cachedData.users.filter(u => u.role === 'customer' && !u.disabled).map(u => u.username)
                    : [username];
                for (let target of targets) {
                    await setDoc(doc(db, 'chatMessages', (Date.now() + Math.random() + target).toString()), {
                        id: Date.now() + Math.random() + target,
                        from: 'admin',
                        to: target,
                        text: `[NOTIFICATION] ${title}\n\n${message}`,
                        image: null,
                        time: new Date().toISOString(),
                        read: false,
                        type: 'notification'
                    });
                }
                document.getElementById('notifStatus').innerHTML = `<span style="color:#10b981;">✅ Notification sent successfully!</span>`;
                document.getElementById('notifTitle').value = '';
                document.getElementById('notifMessage').value = '';
                toast('Notification sent!');
            } catch (e) {
                document.getElementById('notifStatus').innerHTML = `<span style="color:#dc2626;">Error: ${e.message}</span>`;
            }
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Notification';
        };
    }

    // ===== COMPRESS IMAGE HELPER =====
    async function compressImage(file, maxWidth = 400, maxHeight = 400, quality = 0.5) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth || height > maxHeight) {
                        if (width > height) {
                            height = Math.round(height * maxWidth / width);
                            width = maxWidth;
                        } else {
                            width = Math.round(width * maxHeight / height);
                            height = maxHeight;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    // ===== NAVIGATION =====
    document.querySelectorAll('.nav-item').forEach(el => {
        el.onclick = function() {
            const section = this.dataset.section;
            if (!section) return;
            showLoader();
            renderSection(section);
        };
    });

    document.getElementById('logoutBtn').onclick = () => {
        // Unsubscribe all listeners
        Object.values(unsubscribers).forEach(unsub => { if (unsub) unsub(); });
        unsubscribers = {};
        if (window.__chatUnsub) { window.__chatUnsub(); window.__chatUnsub = null; }
        admin = null;
        sessionStorage.removeItem('adminSession');
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('loginUser').value = '';
        document.getElementById('loginPass').value = '';
        firebaseSignOut(auth).then(() => {
            console.log("Signed out from Firebase");
        }).catch((error) => {
            console.error("Sign out error:", error);
        });
    };

    // ===== INIT =====
    if (checkSession()) {
        (async () => {
            // Load agencies and orders first for login
            const snapA = await getDocs(collection(db,'agencies'));
            cachedData.agencies = []; snapA.forEach(d => cachedData.agencies.push({ id:d.id, ...d.data() }));
            const snapO = await getDocs(collection(db,'customOrders'));
            cachedData.customOrders = []; snapO.forEach(d => cachedData.customOrders.push({ id:d.id, ...d.data() }));
            const snapP = await getDocs(collection(db,'popupAds'));
            cachedData.popupAds = []; snapP.forEach(d => cachedData.popupAds.push({ id:d.id, ...d.data() }));
            const settings = await getDoc(doc(db,'systemSettings','main'));
            if (settings.exists()) cachedData.systemSettings = settings.data();

            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            // Load users listener
            if (!unsubscribers['users']) {
                unsubscribers['users'] = onSnapshot(query(collection(db,'users'), limit(500)), (snap) => {
                    cachedData.users = [];
                    snap.forEach(d => cachedData.users.push({ id:d.id, ...d.data() }));
                    const total = cachedData.users.filter(u => u.role !== 'admin' && u.role !== 'agency').length;
                    document.getElementById('memberCount').textContent = total;
                    if (['dashboard','members','vip','injection'].includes(currentSection)) {
                        renderSection(currentSection);
                    }
                    const ind = document.getElementById('liveIndicator');
                    ind.style.display = 'flex';
                    setTimeout(() => { ind.style.display = 'none'; }, 1200);
                });
            }
            const saved = localStorage.getItem('adminSection');
            renderSection(saved || 'dashboard');
        })();
    } else {
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('adminPanel').style.display = 'none';
    }

    console.log('Trip.com Admin Panel loaded (optimized)');
</script>
