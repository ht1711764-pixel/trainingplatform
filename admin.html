<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Trip.com Admin | Premium Control Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* ===== ROOT VARIABLES - Premium Luxury ===== */
        :root {
            --gold: #D4AF37;
            --gold-light: #F5E7B2;
            --gold-dark: #C9A03D;
            --gold-glow: rgba(212,175,55,0.12);
            --bg: #080a0e;
            --card: rgba(16,20,30,0.78);
            --border: rgba(212,175,55,0.15);
            --text: rgba(255,255,255,0.92);
            --muted: rgba(255,255,255,0.4);
            --shadow: 0 8px 40px rgba(0,0,0,0.5);
            --radius: 16px;
            --glass: blur(14px);
            --gradient: linear-gradient(135deg, #D4AF37, #F5E7B2, #C9A03D);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Inter',sans-serif;
            background:var(--bg);
            color:var(--text);
            height:100vh;
            overflow:hidden;
        }
        .admin-wrap { display:flex; height:100vh; }
        .sidebar {
            width:220px;
            background:var(--card);
            backdrop-filter:var(--glass);
            border-right:1px solid var(--border);
            padding:16px 10px;
            overflow-y:auto;
            display:flex;
            flex-direction:column;
            flex-shrink:0;
        }
        .sidebar::-webkit-scrollbar { width:3px; }
        .sidebar::-webkit-scrollbar-track { background:transparent; }
        .sidebar::-webkit-scrollbar-thumb { background:var(--gold); border-radius:10px; }
        .sidebar-brand {
            display:flex;
            align-items:center;
            gap:10px;
            padding:0 6px 14px 6px;
            border-bottom:1px solid var(--border);
            margin-bottom:10px;
        }
        .logo-plane {
            width:38px; height:38px;
            background:var(--gradient);
            border-radius:12px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:18px;
            color:#0a0c10;
            box-shadow:0 4px 15px rgba(212,175,55,0.12);
            flex-shrink:0;
        }
        .logo-text-name {
            font-family:'Playfair Display',serif;
            font-size:20px;
            font-weight:700;
            background:var(--gradient);
            -webkit-background-clip:text;
            background-clip:text;
            color:transparent;
            letter-spacing:1px;
        }
        .sidebar-brand .dot {
            width:6px; height:6px;
            background:#10b981;
            border-radius:50%;
            display:inline-block;
            animation:pulse 1.5s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }
        .nav-item {
            padding:8px 12px;
            margin:1px 0;
            border-radius:10px;
            cursor:pointer;
            color:var(--muted);
            transition:all 0.2s;
            display:flex;
            align-items:center;
            gap:10px;
            font-weight:500;
            font-size:13px;
            border-left:2px solid transparent;
        }
        .nav-item:hover { color:var(--text); background:rgba(212,175,55,0.03); }
        .nav-item.active {
            color:var(--gold);
            background:rgba(212,175,55,0.04);
            border-left-color:var(--gold);
        }
        .nav-item i { width:18px; text-align:center; font-size:14px; }
        .nav-item .count {
            margin-left:auto;
            background:rgba(212,175,55,0.06);
            padding:0 8px;
            border-radius:30px;
            font-size:9px;
            color:var(--gold);
            font-weight:600;
        }
        .nav-divider {
            border:none;
            border-top:1px solid var(--border);
            margin:8px 0;
        }
        .main {
            flex:1;
            padding:16px 20px;
            overflow-y:auto;
            background:radial-gradient(ellipse at 20% 30%, rgba(212,175,55,0.02) 0%, transparent 60%),
                     radial-gradient(ellipse at 80% 70%, rgba(212,175,55,0.015) 0%, transparent 50%),
                     var(--bg);
        }
        .main::-webkit-scrollbar { width:4px; }
        .main::-webkit-scrollbar-track { background:transparent; }
        .main::-webkit-scrollbar-thumb { background:var(--gold); border-radius:10px; }
        .card-glass {
            background:var(--card);
            backdrop-filter:var(--glass);
            border-radius:var(--radius);
            padding:16px;
            margin-bottom:14px;
            border:1px solid var(--border);
            box-shadow:var(--shadow);
            transition:0.25s;
        }
        .card-glass:hover {
            border-color:rgba(212,175,55,0.25);
            box-shadow:0 12px 48px rgba(0,0,0,0.35);
        }
        .card-glass .title {
            font-size:17px;
            font-weight:700;
            color:var(--gold);
            margin-bottom:12px;
            display:flex;
            align-items:center;
            gap:8px;
        }
        .card-glass .title i { font-size:15px; }
        .btn-gold {
            background:var(--gradient);
            border:none;
            padding:6px 16px;
            border-radius:40px;
            font-weight:700;
            color:#0a120e;
            cursor:pointer;
            transition:0.25s;
            font-size:12px;
            box-shadow:0 4px 15px rgba(212,175,55,0.1);
            display:inline-flex;
            align-items:center;
            gap:5px;
        }
        .btn-gold:hover { transform:scale(1.02); box-shadow:0 6px 25px rgba(212,175,55,0.18); }
        .btn-gold:active { transform:scale(0.97); }
        .btn-gold-sm { padding:4px 12px; font-size:11px; }
        .btn-ghost {
            background:transparent;
            border:1px solid var(--border);
            color:var(--text);
            padding:5px 14px;
            border-radius:40px;
            cursor:pointer;
            transition:0.25s;
            font-size:12px;
            display:inline-flex;
            align-items:center;
            gap:5px;
        }
        .btn-ghost:hover { border-color:var(--gold); color:var(--gold); background:rgba(212,175,55,0.02); }
        .btn-danger { background:linear-gradient(135deg,#dc2626,#ef4444); color:#fff; border:none; }
        .btn-danger:hover { transform:scale(1.02); }
        .btn-success { background:linear-gradient(135deg,#10b981,#059669); color:#fff; border:none; }
        .btn-success:hover { transform:scale(1.02); }
        .btn-warning { background:linear-gradient(135deg,#f59e0b,#d97706); color:#fff; border:none; }
        .btn-warning:hover { transform:scale(1.02); }
        .btn-info { background:linear-gradient(135deg,#3b82f6,#2563eb); color:#fff; border:none; }
        .btn-info:hover { transform:scale(1.02); }
        .input-glass {
            background:rgba(0,0,0,0.3);
            border:1px solid var(--border);
            padding:7px 12px;
            border-radius:10px;
            color:#fff;
            width:100%;
            font-size:13px;
            outline:none;
            transition:0.25s;
        }
        .input-glass:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(212,175,55,0.04); }
        .input-glass::placeholder { color:var(--muted); }
        select.input-glass { appearance:none; }

        .modal-overlay {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.92);

        .modal-box {

            border-radius:var(--radius);

            border:1px solid var(--gold);

            font-size:17px; font-weight:700; color:var(--gold);
            margin-bottom:12px; display:flex; align-items:center; gap:8px;
        }
        .chat-wrap {
            display:flex;
            flex-direction:column;
            height:50vh;
            background:rgba(0,0,0,0.08);
            border-radius:var(--radius);
            overflow:hidden;
            border:1px solid var(--border);
        }
        .chat-msgs {
            flex:1;
            overflow-y:auto;
            padding:12px;
            display:flex;
            flex-direction:column;
            gap:5px;
        }
        .chat-msg {
            max-width:80%;
            padding:6px 12px;
            border-radius:14px;
            font-size:13px;
            line-height:1.4;
            word-break:break-word;
        }
        .chat-msg.sent {
            align-self:flex-end;
            background:var(--gradient);
            color:#0a120e;
            border-bottom-right-radius:3px;
        }
        .chat-msg.received {
            align-self:flex-start;
            background:rgba(255,255,255,0.03);
            border:1px solid var(--border);
            border-bottom-left-radius:3px;
        }
        .chat-msg .time { font-size:8px; opacity:0.3; margin-top:2px; text-align:right; }
        .chat-msg img { max-width:120px; max-height:80px; border-radius:6px; margin-top:3px; border:1px solid var(--gold); cursor:pointer; }
        .chat-input {
            display:flex;
            gap:5px;
            padding:8px 10px;
            background:rgba(0,0,0,0.08);
            border-top:1px solid var(--border);
            align-items:center;

        @media(max-width:768px) {

        .login-box .brand .name {

            position:fixed;
            bottom:76px;

            border-radius:40px;

            z-index:100;

        .live-indicator {
            position:fixed;
            bottom:20px;
            right:16px;
            background:rgba(16,185,129,0.8);
            backdrop-filter:blur(8px);
            color:#fff;
            padding:2px 10px;
            border-radius:30px;
            font-size:8px;
            z-index:100;
            animation:pulse 1.5s infinite;
            display:none;
            border:1px solid rgba(255,255,255,0.02);
        }
        .flex { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; }
        .gap-1 { gap:4px; }
        .mt-1 { margin-top:6px; }
        .mb-1 { margin-bottom:6px; }
        .text-gold { color:var(--gold); }
        .text-muted { color:var(--muted); }
        .text-center { text-align:center; }
        .w-full { width:100%; }
        .img-preview { max-width:70px; max-height:70px; border-radius:6px; border:1px solid var(--gold); cursor:pointer; }
        .img-preview-sm { max-width:50px; max-height:50px; border-radius:4px; border:1px solid var(--gold); cursor:pointer; }
        .online-dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:4px; }
        .online-dot.online { background:#10b981; animation:pulse 1.5s infinite; }
        .online-dot.offline { background:var(--muted); }
        ::-webkit-scrollbar { width:3px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:var(--gold); border-radius:10px; }
    </style>
</head>

    // ===== IMAGE COMPRESSION (Base64 Optimization) =====
    function compressImage(file, maxWidth = 400, maxHeight = 400, quality = 0.5) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth || height > maxHeight) {
                        if (width > height) {
                            height = Math.round(height * maxWidth / width);
                            width = maxWidth;
                        } else {
                            width = Math.round(width * maxHeight / height);
                            height = maxHeight;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    // ===== HELPERS =====
    function esc(s) { if(!s) return ''; return s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]||m); }
    function toast(msg, err=false) {
        const el = document.createElement('div');
        el.className = `toast-msg${err ? ' error' : ''}`;
        el.innerHTML = `<i class="fas ${err ? 'fa-exclamation-triangle' : 'fa-circle-check'}"></i> ${msg}`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2200);
    }
    function showLoader() {
        const l = document.createElement('div');
        l.id = 'loader';

    function getVIP(balance) {
        if (balance >= 1500) return 4;
        if (balance >= 500) return 3;
        if (balance >= 100) return 2;
        return 1;
    }
    function getVipClass(lv) {
        return lv===1?'vip-1':lv===2?'vip-2':lv===3?'vip-3':'vip-4';
    }
    function togglePw(id, btn) {
        const inp = document.getElementById(id);
        const icon = btn.querySelector('i');
        if (inp.type === 'password') { inp.type='text'; icon.classList.replace('fa-eye','fa-eye-slash'); }

    // ===== AUTH =====
    async function login(username, password) {
        const a = agencies.find(x => x.username === username && x.password === password && x.status === 'active');
        if (a) return { success:true, data:a, role:'agency', perms:a.permissions||{} };
        if (username === 'admin' && password === 'admin123') return { success:true, data:{id:'admin',username:'admin'}, role:'admin', perms:{all:true} };
        if (username === 'hein' && password === '123456') return { success:true, data:{id:'master',username:'hein'}, role:'master', perms:{all:true} };
        const q = query(collection(db,'users'), where('username','==',username), where('role','==','admin'));
        const snap = await getDocs(q);
        if (!snap.empty) {
            const d = snap.docs[0].data();
            if (d.password === password) return { success:true, data:{id:snap.docs[0].id,...d}, role:'admin', perms:{all:true} };
        }
        return { success:false };
    }

    document.getElementById('loginBtn').onclick = async () => {
        const user = document.getElementById('loginUser').value.trim();
        const pass = document.getElementById('loginPass').value;
        const err = document.getElementById('loginError');
        err.textContent = '';
        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i>';
        try {
            await loadAllData();
            const res = await login(user, pass);
            if (res.success) {
                admin = { id: res.data.id, username: res.data.username, role: res.role, perms: res.perms, loginTime: Date.now() };
                sessionStorage.setItem('adminSession', JSON.stringify(admin));
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                startSubscriptions();
                renderSection('dashboard');
            } else {
                err.textContent = 'Invalid credentials';
            }
        } catch(e) {
            err.textContent = 'Network error';
        }
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Login';
    };

    document.getElementById('loginToggle').onclick = function() {
        const inp = document.getElementById('loginPass');
        const icon = this.querySelector('i');
        if (inp.type === 'password') { inp.type = 'text'; icon.classList.replace('fa-eye','fa-eye-slash'); }
        else { inp.type = 'password'; icon.classList.replace('fa-eye-slash','fa-eye'); }
    };

    function checkSession() {
        const s = sessionStorage.getItem('adminSession');
        if (s) {
            const d = JSON.parse(s);
            if (Date.now() - d.loginTime < 24*60*60*1000) {
                admin = d;
                return true;
            }
            sessionStorage.removeItem('adminSession');
        }
        return false;
    }

    // ===== LOAD DATA =====
    async function loadAllData() {
        try {
            const snap1 = await getDocs(query(collection(db,'users'), limit(500)));
            users = []; snap1.forEach(d => users.push({ id:d.id, ...d.data() }));
            const snap2 = await getDocs(collection(db,'agencies'));
            agencies = []; snap2.forEach(d => agencies.push({ id:d.id, ...d.data() }));
            const snap3 = await getDocs(collection(db,'injections'));
            injections = []; snap3.forEach(d => injections.push({ id:d.id, ...d.data() }));
            const snap4 = await getDocs(collection(db,'customOrders'));
            customOrders = []; snap4.forEach(d => customOrders.push({ id:d.id, ...d.data() }));
            const snap5 = await getDocs(query(collection(db,'rechargeRequests'), orderBy('timestamp','desc'), limit(200)));
            rechargeReqs = []; snap5.forEach(d => rechargeReqs.push({ id:d.id, ...d.data() }));
            const snap6 = await getDocs(query(collection(db,'withdrawRequests'), orderBy('timestamp','desc'), limit(200)));
            withdrawReqs = []; snap6.forEach(d => withdrawReqs.push({ id:d.id, ...d.data() }));
            const snap7 = await getDocs(query(collection(db,'loanRequests'), orderBy('timestamp','desc'), limit(200)));
            loanReqs = []; snap7.forEach(d => loanReqs.push({ id:d.id, ...d.data() }));
            const snap8 = await getDocs(collection(db,'popupAds'));
            popupAds = []; snap8.forEach(d => popupAds.push({ id:d.id, ...d.data() }));
            const settings = await getDoc(doc(db,'systemSettings','main'));
            if (settings.exists()) systemSettings = settings.data();
        } catch(e) { console.error(e); }
    }

    // ===== SUBSCRIPTIONS =====
    function startSubscriptions() {
        if (unsubUsers) unsubUsers();
        unsubUsers = onSnapshot(query(collection(db,'users'), limit(500)), (snap) => {
            users = [];
            snap.forEach(d => users.push({ id:d.id, ...d.data() }));
            if (['dashboard','members','vip','injection'].includes(currentSection)) renderSection(currentSection);
            document.getElementById('memberCount').textContent = users.filter(u => u.role !== 'admin' && u.role !== 'agency').length;
            const ind = document.getElementById('liveIndicator');
            ind.style.display = 'flex';
            setTimeout(() => { ind.style.display = 'none'; }, 1200);
        });
        if (unsubInjections) unsubInjections();
        unsubInjections = onSnapshot(collection(db,'injections'), (snap) => {
            injections = [];
            snap.forEach(d => injections.push({ id:d.id, ...d.data() }));
            if (currentSection === 'injection') renderSection('injection');
        });
        onSnapshot(query(collection(db,'rechargeRequests'), orderBy('timestamp','desc'), limit(200)), (snap) => {
            rechargeReqs = [];
            snap.forEach(d => rechargeReqs.push({ id:d.id, ...d.data() }));
            if (currentSection === 'recharge') renderSection('recharge');
        });
        onSnapshot(query(collection(db,'withdrawRequests'), orderBy('timestamp','desc'), limit(200)), (snap) => {
            withdrawReqs = [];
            snap.forEach(d => withdrawReqs.push({ id:d.id, ...d.data() }));
            if (currentSection === 'withdraw') renderSection('withdraw');
        });
    }

    // ===== RENDER FUNCTIONS =====
    function renderSection(section) {
        currentSection = section;
        localStorage.setItem('adminSection', section);
        document.querySelectorAll('.nav-item').forEach(el => {
            el.classList.toggle('active', el.dataset.section === section);
        });
        const main = document.getElementById('mainContent');
        switch(section) {
            case 'dashboard': renderDashboard(main); break;
            case 'members': renderMembers(main); break;
            case 'vip': renderVIP(main); break;
            case 'injection': renderInjection(main); break;
            case 'orders': renderOrders(main); break;
            case 'recharge': renderRecharge(main); break;
            case 'withdraw': renderWithdraw(main); break;
            case 'loans': renderLoans(main); break;
            case 'agency': renderAgency(main); break;
            case 'settings': renderSettings(main); break;
            case 'popup': renderPopup(main); break;
            case 'chat': renderChat(main); break;
            default: main.innerHTML = '<div class="card-glass"><p>Section not found</p></div>';
        }
    }

                        <tbody id="memberTableBody"></tbody>
                    </table>

        function renderTable(filter='') {
            const filtered = customers.filter(u => {
                const s = (u.username||'').toLowerCase() + (u.email||'').toLowerCase() + (u.phone||'').toLowerCase();
                return s.includes(filter.toLowerCase());
            });

            if (!filtered.length) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:16px;">No members</td></tr>'; return; }
            tbody.innerHTML = filtered.map(u => {
                const lv = getVIP(u.balance||0);
                const vc = getVipClass(lv);
                const isOnline = u.lastSeen && (Date.now() - u.lastSeen < 60000);
                const lastSeenTime = u.lastSeen ? new Date(u.lastSeen).toLocaleString('en-US', { timeZone: 'Asia/Yangon' }) : 'Never';
                return `<tr>

    window.setupOrder = async (id) => {
        const u = users.find(x => x.id === id);
        if (!u) return;
        const c = parseInt(prompt('Add/remove orders (+/-):', 0));
        if (!isNaN(c)) {
            if (!u.tasks) u.tasks = { completed:0, total:0 };
            if (c > 0) u.tasks.total += c;
            else if (c < 0) {
                const r = Math.abs(c);
                if (u.tasks.total >= r) { u.tasks.total -= r; if (u.tasks.completed > u.tasks.total) u.tasks.completed = u.tasks.total; }
            }
            await updateDoc(doc(db,'users',id), { tasks: u.tasks });
            toast('Orders updated');
            renderSection('members');
        }
    };
    window.setupBalance = async (id) => {
        const u = users.find(x => x.id === id);
        if (!u) return;
        const b = prompt('New balance:', u.balance);
        if (b && !isNaN(parseFloat(b))) {
            await updateDoc(doc(db,'users',id), { balance: parseFloat(b) });
            toast('Balance updated');
            renderSection('members');
        }
    };
    window.changeLogin = async (id) => {

                <div class="title"><i class="fas fa-hand-holding-heart"></i> Loan Requests</div>
                ${loanReqs.length ? loanReqs.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp)).map(l => `
                    <div style="padding:8px 12px;background:rgba(0,0,0,0.04);border-radius:8px;margin-bottom:6px;border:1px solid var(--border);">
                        <div class="flex"><strong>${esc(l.userName)}</strong> <span class="badge-status ${l.status==='pending'?'badge-pending':l.status==='approved'?'badge-approved':'badge-rejected'}">${l.status}</span></div>
                        <div style="font-size:12px;">Amount: S$ ${l.amount} | Doc: ${l.docType}</div>
                        <div style="font-size:11px;color:var(--muted);">${new Date(l.timestamp).toLocaleString()}</div>
                        <div class="flex gap-1" style="flex-wrap:wrap;margin-top:3px;">
                            ${l.bankImage ? `<img src="${l.bankImage}" class="img-preview-sm" onclick="window.open(this.src)">` : ''}
                            ${l.frontImage ? `<img src="${l.frontImage}" class="img-preview-sm" onclick="window.open(this.src)">` : ''}
                            ${l.backImage ? `<img src="${l.backImage}" class="img-preview-sm" onclick="window.open(this.src)">` : ''}
                        </div>
                        ${l.status === 'pending' ? `
                            <div class="flex gap-1" style="margin-top:4px;">
                                <button class="btn-gold btn-gold-sm" style="background:linear-gradient(135deg,#10b981,#059669);color:#fff;" onclick="window.approveLoan('${l.id}')"><i class="fas fa-check"></i> Approve</button>
                                <button class="btn-gold btn-gold-sm" style="background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;" onclick="window.rejectLoan('${l.id}')"><i class="fas fa-times"></i> Reject</button>
                            </div>
                        ` : ''}
                    </div>
                `).join('') : '<p style="color:var(--muted);text-align:center;padding:12px;">No requests</p>'}
            </div>
        `;
    }

    window.approveLoan = async (id) => {
        const l = loanReqs.find(x => x.id === id);
        if (!l || l.status !== 'pending') return;
        const u = users.find(x => x.id === l.userId);
        if (u) {
            await updateDoc(doc(db,'users',u.id), { balance: (u.balance||0) + l.amount });
            await updateDoc(doc(db,'loanRequests',id), { status: 'approved' });
            toast(`✅ Loan S$ ${l.amount} approved`);
            renderSection('loans');
        }
    };

    window.rejectLoan = async (id) => {
        if (!confirm('Reject this loan?')) return;
        await updateDoc(doc(db,'loanRequests',id), { status: 'rejected' });
        toast('Rejected');
        renderSection('loans');
    };

    // ===== AGENCY =====
    function renderAgency(main) {
        main.innerHTML = `
            <div class="card-glass">
                <div class="flex">
                    <div class="title"><i class="fas fa-user-tie"></i> Agencies</div>
                    <button class="btn-gold btn-gold-sm" id="addAgencyBtn"><i class="fas fa-plus"></i> Create</button>
                </div>
                ${agencies.length ? agencies.map(a => `
                    <div style="padding:8px 12px;background:rgba(0,0,0,0.04);border-radius:8px;margin-bottom:6px;border:1px solid var(--border);">
                        <div class="flex">
                            <div><strong style="color:var(--gold);">${esc(a.username)}</strong> <span class="badge-status ${a.status==='active'?'badge-active':'badge-inactive'}">${a.status}</span></div>
                            <div class="flex gap-1">
                                <button class="btn-gold btn-gold-sm" onclick="window.genCode('${a.id}')"><i class="fas fa-qrcode"></i></button>
                                ${a.status === 'active' ? `
                                    <button class="btn-gold btn-gold-sm" onclick="window.changeAgencyPw('${a.id}')"><i class="fas fa-key"></i></button>
                                    <button class="btn-gold btn-gold-sm" style="background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;" onclick="window.toggleAgency('${a.id}')"><i class="fas fa-lock"></i></button>
                                ` : `<button class="btn-gold btn-gold-sm" style="background:linear-gradient(135deg,#10b981,#059669);color:#fff;" onclick="window.toggleAgency('${a.id}')"><i class="fas fa-lock-open"></i></button>`}
                                <button class="btn-gold btn-gold-sm" style="background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;" onclick="window.deleteAgency('${a.id}')"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                        <div style="font-size:11px;color:var(--muted);">Email: ${a.email||'N/A'} | Created: ${new Date(a.createdAt).toLocaleString()}</div>
                        <div style="font-size:10px;color:var(--muted);">Permissions: ${Object.entries(a.permissions||{}).filter(([k,v])=>v).map(([k])=>k.replace('can','')).join(', ')}</div>
                    </div>
                `).join('') : '<p style="color:var(--muted);text-align:center;padding:12px;">No agencies</p>'}
            </div>
        `;
        document.getElementById('addAgencyBtn').onclick = showAddAgency;
    }

    window.genCode = async (id) => {
        const a = agencies.find(x => x.id === id);
        if (!a) return;
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.innerHTML = `
            <div class="modal-box" style="text-align:center;">
                <div style="font-size:12px;color:var(--muted);">Access Code for ${esc(a.username)}</div>
                <div style="font-size:32px;font-weight:800;color:var(--gold);letter-spacing:4px;padding:10px;background:rgba(0,0,0,0.08);border-radius:10px;margin:10px 0;">${code}</div>
                <div style="font-size:10px;color:#f59e0b;"><i class="fas fa-clock"></i> Valid for 5 minutes</div>
                <button class="btn-gold" onclick="navigator.clipboard.writeText('${code}')"><i class="fas fa-copy"></i> Copy</button>
                <button class="btn-ghost" id="codeClose">Close</button>
            </div>
        `;
        document.body.appendChild(modal);
        document.getElementById('codeClose').onclick = () => document.body.removeChild(modal);
    };

    window.changeAgencyPw = (id) => {
        const a = agencies.find(x => x.id === id);
        if (!a) return;
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.innerHTML = `
            <div class="modal-box">
                <div class="modal-title"><i class="fas fa-key"></i> Change Password</div>
                <div class="pw-wrap"><input type="password" class="input-glass" id="apwNew" placeholder="New Password"><button class="pw-toggle" onclick="togglePw('apwNew',this)"><i class="fas fa-eye"></i></button></div>
                <div class="pw-wrap"><input type="password" class="input-glass" id="apwConfirm" placeholder="Confirm"><button class="pw-toggle" onclick="togglePw('apwConfirm',this)"><i class="fas fa-eye"></i></button></div>
                <div class="flex gap-1" style="margin-top:8px;">
                    <button class="btn-gold" id="apwSubmit">Update</button>
                    <button class="btn-ghost" id="apwCancel">Cancel</button>
                </div>
                <div id="apwStatus" style="text-align:center;margin-top:6px;font-size:12px;"></div>
            </div>
        `;
        document.body.appendChild(modal);
        document.getElementById('apwSubmit').onclick = async () => {
            const p1 = document.getElementById('apwNew').value;
            const p2 = document.getElementById('apwConfirm').value;
            if (!p1) { document.getElementById('apwStatus').innerHTML = '<span style="color:#dc2626;">Enter password</span>'; return; }
            if (p1 !== p2) { document.getElementById('apwStatus').innerHTML = '<span style="color:#dc2626;">Passwords do not match</span>'; return; }
            await updateDoc(doc(db,'agencies',id), { password: p1 });
            document.getElementById('apwStatus').innerHTML = '<span style="color:#10b981;">✅ Updated</span>';
            setTimeout(() => { document.body.removeChild(modal); renderSection('agency'); }, 700);
        };
        document.getElementById('apwCancel').onclick = () => document.body.removeChild(modal);
    };

    window.toggleAgency = async (id) => {
        const a = agencies.find(x => x.id === id);
        if (!a) return;
        const newStatus = a.status === 'active' ? 'closed' : 'active';
        await updateDoc(doc(db,'agencies',id), { status: newStatus });
        toast(`Agency ${newStatus}`);
        renderSection('agency');
    };

    window.deleteAgency = async (id) => {
        if (!confirm('Delete this agency?')) return;
        await deleteDoc(doc(db,'agencies',id));
        agencies = agencies.filter(x => x.id !== id);
        toast('Deleted');
        renderSection('agency');
    };

    function showAddAgency() {
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.innerHTML = `
            <div class="modal-box">
                <div class="modal-title"><i class="fas fa-user-tie"></i> Create Agency</div>
                <input class="input-glass" id="aaUser" placeholder="Username">
                <input class="input-glass" id="aaEmail" placeholder="Email">
                <div class="pw-wrap"><input type="password" class="input-glass" id="aaPass" placeholder="Password"><button class="pw-toggle" onclick="togglePw('aaPass',this)"><i class="fas fa-eye"></i></button></div>
                <div class="pw-wrap"><input type="password" class="input-glass" id="aaConfirm" placeholder="Confirm"><button class="pw-toggle" onclick="togglePw('aaConfirm',this)"><i class="fas fa-eye"></i></button></div>
                <div style="margin:6px 0;"><label style="font-size:12px;color:var(--gold);">Permissions</label>
                    <div style="display:flex;flex-wrap:wrap;gap:3px;font-size:11px;">
                        ${['Members','VIP','Inject','Orders','Recharge','Withdraw','Loans','Settings','Chat'].map(p => `
                            <label style="background:rgba(0,0,0,0.06);padding:2px 8px;border-radius:20px;border:1px solid var(--border);">
                                <input type="checkbox" id="aa_${p}" ${p!=='Settings'?'checked':''}> ${p}
                            </label>
                        `).join('')}
                    </div>
                </div>
                <div class="flex gap-1" style="margin-top:8px;">
                    <button class="btn-gold" id="aaSubmit">Create</button>
                    <button class="btn-ghost" id="aaCancel">Cancel</button>
                </div>
                <div id="aaStatus" style="text-align:center;margin-top:6px;font-size:12px;"></div>
            </div>
        `;
        document.body.appendChild(modal);
        document.getElementById('aaSubmit').onclick = async () => {
            const u = document.getElementById('aaUser').value.trim();
            const e = document.getElementById('aaEmail').value.trim();
            const p = document.getElementById('aaPass').value;
            const c = document.getElementById('aaConfirm').value;
            if (!u || !e || !p) { document.getElementById('aaStatus').innerHTML = '<span style="color:#dc2626;">All fields required</span>'; return; }
            if (p !== c) { document.getElementById('aaStatus').innerHTML = '<span style="color:#dc2626;">Passwords do not match</span>'; return; }
            if (agencies.find(x => x.username === u)) { document.getElementById('aaStatus').innerHTML = '<span style="color:#dc2626;">Username exists</span>'; return; }
            const perms = {
                canManageMembers: document.getElementById('aa_Members').checked,
                canManageVIP: document.getElementById('aa_VIP').checked,
                canInject: document.getElementById('aa_Inject').checked,
                canManageOrders: document.getElementById('aa_Orders').checked,
                canManageRecharge: document.getElementById('aa_Recharge').checked,
                canManageWithdraw: document.getElementById('aa_Withdraw').checked,
                canManageLoans: document.getElementById('aa_Loans').checked,
                canEditSettings: document.getElementById('aa_Settings').checked,
                canChat: document.getElementById('aa_Chat').checked
            };
            const data = {
                id: Date.now().toString(),
                username: u, email: e, password: p,
                role: 'agency',
                permissions: perms,
                status: 'active',
                createdAt: new Date().toISOString(),
                lastLogin: null
            };
            await setDoc(doc(db,'agencies',data.id), data);
            document.getElementById('aaStatus').innerHTML = '<span style="color:#10b981;">✅ Created</span>';
            setTimeout(() => { document.body.removeChild(modal); renderSection('agency'); }, 700);
        };
        document.getElementById('aaCancel').onclick = () => document.body.removeChild(modal);
    }

    // ===== SETTINGS =====
    function renderSettings(main) {
        main.innerHTML = `
            <div class="card-glass">
                <div class="title"><i class="fas fa-paint-brush"></i> Settings</div>
                <div style="margin-bottom:6px;"><label style="font-size:12px;color:var(--gold);">USDT Wallet Address</label><input class="input-glass" id="setWallet" value="${systemSettings.usdtWalletAddress||''}"></div>
                <div style="margin-bottom:6px;"><label style="font-size:12px;color:var(--gold);">Min Balance for Order</label><input class="input-glass" id="setMin" type="number" step="0.01" value="${systemSettings.minBalanceForOrder||10}"></div>
                <button class="btn-gold" id="setSave">Save Settings</button>
            </div>
        `;
        document.getElementById('setSave').onclick = async () => {
            const wallet = document.getElementById('setWallet').value.trim();
            const min = parseFloat(document.getElementById('setMin').value) || 10;
            await setDoc(doc(db,'systemSettings','main'), { usdtWalletAddress: wallet, minBalanceForOrder: min }, { merge: true });
            systemSettings.usdtWalletAddress = wallet;
            systemSettings.minBalanceForOrder = min;
            toast('Settings saved!');
        };
    }

    // ===== POPUP ADS =====
    function renderPopup(main) {
        main.innerHTML = `
            <div class="card-glass">
                <div class="flex">
                    <div class="title"><i class="fas fa-ad"></i> Popup Ads</div>
                    <button class="btn-gold btn-gold-sm" id="popAddBtn"><i class="fas fa-plus"></i> Create</button>
                </div>
                <div id="popList">
                    ${popupAds.length ? popupAds.map(p => `
                        <div style="padding:8px 12px;background:rgba(0,0,0,0.04);border-radius:8px;margin-bottom:6px;border:1px solid var(--border);">
                            <div class="flex">
                                <div><strong style="color:var(--gold);">${esc(p.title||'Untitled')}</strong> <span class="badge-status ${p.isActive!==false?'badge-active':'badge-inactive'}">${p.isActive!==false?'Active':'Inactive'}</span></div>
                                <div class="flex gap-1">
                                    <button class="btn-gold btn-gold-sm" onclick="window.editPopup('${p.id}')"><i class="fas fa-edit"></i></button>
                                    <button class="btn-gold btn-gold-sm" style="background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;" onclick="window.deletePopup('${p.id}')"><i class="fas fa-trash"></i></button>
                                </div>
                            </div>
                            ${p.imageData ? `<img src="${p.imageData}" class="img-preview-sm" onclick="window.open(this.src)">` : ''}
                            <div style="font-size:11px;color:var(--muted);">${p.subtitle||''}</div>
                        </div>
                    `).join('') : '<p style="color:var(--muted);text-align:center;padding:12px;">No popup ads</p>'}
                </div>
            </div>
        `;
        document.getElementById('popAddBtn').onclick = () => showPopupForm();
    }

    window.editPopup = (id) => {
        const p = popupAds.find(x => x.id === id);
        if (p) showPopupForm(p);
    };

    window.deletePopup = async (id) => {
        if (!confirm('Delete this popup ad?')) return;
        await deleteDoc(doc(db,'popupAds',id));
        popupAds = popupAds.filter(x => x.id !== id);
        toast('Deleted');
        renderSection('popup');
    };

    function showPopupForm(existing=null) {
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        const isEdit = !!existing;
        modal.innerHTML = `
            <div class="modal-box">
                <div class="modal-title">${isEdit ? '✏️ Edit' : '🆕 Create'} Popup Ad</div>
                <input class="input-glass" id="popTitle" placeholder="Title" value="${esc(existing?.title||'')}">
                <textarea class="input-glass" id="popSub" placeholder="Subtitle / Message" rows="2">${esc(existing?.subtitle||'')}</textarea>
                <input type="file" class="input-glass" id="popImg" accept="image/*">
                <div id="popPreview" style="margin-top:3px;">${existing?.imageData ? `<img src="${existing.imageData}" class="img-preview-sm">` : ''}</div>
                <select class="input-glass" id="popActive">
                    <option value="true" ${existing?.isActive!==false?'selected':''}>Active</option>
                    <option value="false" ${existing?.isActive===false?'selected':''}>Inactive</option>
                </select>
                <div class="flex gap-1" style="margin-top:8px;">
                    <button class="btn-gold" id="popSubmit">${isEdit ? 'Update' : 'Create'}</button>
                    <button class="btn-ghost" id="popCancel">Cancel</button>
                </div>
                <div id="popStatus" style="text-align:center;margin-top:6px;font-size:12px;"></div>
            </div>
        `;
        document.body.appendChild(modal);
        document.getElementById('popImg').onchange = async function(e) {
            if (e.target.files[0]) {
                const data = await compressImage(e.target.files[0], 400, 400, 0.5);
                document.getElementById('popPreview').innerHTML = `<img src="${data}" class="img-preview-sm">`;
            }
        };
        document.getElementById('popSubmit').onclick = async () => {
            const title = document.getElementById('popTitle').value.trim() || 'Untitled';
            const sub = document.getElementById('popSub').value.trim();
            const active = document.getElementById('popActive').value === 'true';
            const file = document.getElementById('popImg').files[0];
            const status = document.getElementById('popStatus');
            const save = async (img) => {
                const data = { title, subtitle: sub, imageData: img || existing?.imageData || null, isActive: active };
                if (isEdit) {
                    await setDoc(doc(db,'popupAds',existing.id), { ...data, id: existing.id, createdAt: existing.createdAt, updatedAt: new Date().toISOString() });
                    popupAds = popupAds.map(x => x.id === existing.id ? { ...data, id: existing.id, createdAt: existing.createdAt } : x);
                    status.innerHTML = '<span style="color:#10b981;">✅ Updated</span>';
                } else {
                    const id = Date.now().toString();
                    await setDoc(doc(db,'popupAds',id), { ...data, id, createdAt: new Date().toISOString() });
                    popupAds.push({ ...data, id });
                    status.innerHTML = '<span style="color:#10b981;">✅ Created</span>';
                }
                setTimeout(() => { document.body.removeChild(modal); renderSection('popup'); }, 700);
            };
            if (file) {
                const imgData = await compressImage(file, 400, 400, 0.5);
                save(imgData);
            } else save(null);
        };
        document.getElementById('popCancel').onclick = () => document.body.removeChild(modal);
    }

    // ===== CHAT =====
    function renderChat(main) {
        const customers = users.filter(u => u.role !== 'admin' && u.role !== 'agency' && !u.disabled);
        main.innerHTML = `
            <div class="card-glass">
                <div class="title"><i class="fas fa-comment-dots"></i> Customer Chat</div>
                <select class="input-glass" id="chatSelect" style="margin-bottom:6px;">
                    <option value="">-- Select Customer --</option>
                    ${customers.map(u => `<option value="${esc(u.username)}">${esc(u.username)} (${u.email||''})</option>`).join('')}
                </select>
                <div class="chat-wrap">
                    <div class="chat-msgs" id="chatMsgs"></div>
                    <div class="chat-input">
                        <input type="text" class="input-glass" id="chatInput" placeholder="Type..." style="margin:0;flex:1;padding:6px 12px;font-size:12px;min-height:34px;">
                        <button class="btn-gold" id="chatSend" style="width:auto;padding:6px 16px;font-size:12px;min-height:34px;">Send</button>
                    </div>
                </div>
            </div>
        `;
        document.getElementById('chatSelect').onchange = function() {
            chatUser = this.value;
            if (chatUser) {
                document.getElementById('chatMsgs').innerHTML = '<div style="text-align:center;padding:10px;color:var(--muted);">Loading...</div>';
                if (unsubChat) unsubChat();
                const q = query(collection(db,'chatMessages'), orderBy('id','asc'));
                unsubChat = onSnapshot(q, (snap) => {
                    const container = document.getElementById('chatMsgs');
                    if (!container || !chatUser) return;
                    const msgs = [];
                    snap.forEach(d => {
                        const m = d.data();
                        if ((m.to === 'admin' && m.from === chatUser) || (m.from === 'admin' && m.to === chatUser)) msgs.push(m);
                    });
                    msgs.sort((a,b) => a.id - b.id);
                    container.innerHTML = msgs.length ? msgs.map(m => `
                        <div class="chat-msg ${m.from === 'admin' ? 'sent' : 'received'}">
                            <div>${esc(m.text||'')}</div>
                            ${m.image ? `<img src="${m.image}" onclick="window.open(this.src)">` : ''}
                            <div class="time">${m.time||''}</div>
                        </div>
                    `).join('') : '<div style="text-align:center;padding:10px;color:var(--muted);">No messages</div>';
                    container.scrollTop = container.scrollHeight;
                });
            }
        };
        document.getElementById('chatSend').onclick = async () => {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !chatUser) { if (!chatUser) toast('Select customer', true); return; }
            await setDoc(doc(db,'chatMessages',(Date.now()+Math.random()).toString()), {
                id: Date.now() + Math.random(),
                from: 'admin',
                to: chatUser,
                text: text,
                image: null,
                time: new Date().toLocaleString('en-US', { timeZone:'Asia/Bangkok', hour12:false })
            });
            input.value = '';
            input.focus();
        };
        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('chatSend').click();
        });
    }

    // ===== NAVIGATION =====
    document.querySelectorAll('.nav-item').forEach(el => {
        el.onclick = function() {
            const section = this.dataset.section;
            if (!section) return;
            showLoader();
            renderSection(section);
        };
    });

    document.getElementById('logoutBtn').onclick = () => {
        if (unsubChat) unsubChat();
        if (unsubUsers) unsubUsers();
        if (unsubInjections) unsubInjections();
        admin = null;
        sessionStorage.removeItem('adminSession');
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('loginUser').value = '';
        document.getElementById('loginPass').value = '';
    };

    // ===== INIT =====
    if (checkSession()) {
        (async () => {
            await loadAllData();
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            startSubscriptions();
            const saved = localStorage.getItem('adminSection');
            renderSection(saved || 'dashboard');
        })();
    }

    console.log('Trip.com Admin Panel loaded');
</script>
</body>
</html>
