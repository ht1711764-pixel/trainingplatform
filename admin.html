<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Trip.com Admin | Control Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* ===== FONTS ===== */
        @font-face {
            font-family: 'Inter';
            src: url('Inter-VariableFont_opsz,wght.ttf') format('truetype');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Inter';
            src: url('Inter-Italic-VariableFont_opsz,wght.ttf') format('truetype');
            font-weight: 100 900;
            font-style: italic;
            font-display: swap;
        }

        /* ===== CSS VARIABLES (Light & Dark) ===== */
        :root {
            --primary: #1a1a2e;
            --secondary: #2d6a4f;
            --secondary-light: #409f7a;
            --bg: #f8f9fa;
            --bg-card: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #4a4a5a;
            --muted: #8a8a9a;
            --border: rgba(26,26,46,0.08);
            --shadow: 0 4px 24px rgba(26,26,46,0.06);
            --shadow-hover: 0 8px 40px rgba(26,26,46,0.10);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --skeleton-base: #e0e0e0;
            --skeleton-highlight: #f0f0f0;
        }

        [data-theme="dark"] {
            --primary: #f0f0f0;
            --primary-light: #e0e0e0;
            --secondary: #409f7a;
            --secondary-light: #5cb89a;
            --bg: #121212;
            --bg-card: #1e1e1e;
            --text: #f0f0f0;
            --text-secondary: #b0b0b0;
            --muted: #888888;
            --border: rgba(255,255,255,0.08);
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --shadow-hover: 0 8px 40px rgba(0,0,0,0.6);
            --skeleton-base: #2a2a2a;
            --skeleton-highlight: #3a3a3a;
        }

        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            font-family:'Inter', -apple-system, sans-serif;
            background:var(--bg);
            color:var(--text);
            min-height:100vh;
            overflow-y:auto;
            -webkit-font-smoothing:antialiased;
            transition: background 0.3s, color 0.3s;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width:4px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:var(--secondary); border-radius:10px; }

        /* ===== ADMIN WRAP ===== */
        .admin-wrap { display:flex; min-height:100vh; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width:220px;
            background:var(--bg-card);
            border-right:1px solid var(--border);
            padding:16px 10px;
            overflow-y:auto;
            display:flex;
            flex-direction:column;
            flex-shrink:0;
            height:100vh;
            position:sticky; top:0;
            box-shadow:var(--shadow);
            transition: background 0.3s, border-color 0.3s;
        }
        .sidebar::-webkit-scrollbar { width:3px; }
        .sidebar::-webkit-scrollbar-track { background:transparent; }
        .sidebar::-webkit-scrollbar-thumb { background:var(--secondary); border-radius:10px; }

        .sidebar-brand {
            display:flex;
            align-items:center;
            gap:10px;
            padding:0 6px 14px 6px;
            border-bottom:1px solid var(--border);
            margin-bottom:10px;
        }
        .logo-plane {
            width:38px; height:38px;
            background:var(--secondary);
            border-radius:12px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:18px;
            color:#fff;
            box-shadow:0 4px 15px rgba(45,106,79,0.12);
            flex-shrink:0;
        }
        .logo-text-name {
            font-size:20px;
            font-weight:800;
            color:var(--primary);
            letter-spacing:-0.5px;
        }
        .sidebar-brand .dot {
            width:6px; height:6px;
            background:#10b981;
            border-radius:50%;
            display:inline-block;
            animation:pulse 1.5s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }

        .nav-item {
            padding:8px 12px;
            margin:1px 0;
            border-radius:10px;
            cursor:pointer;
            color:var(--text-secondary);
            transition:var(--transition);
            display:flex;
            align-items:center;
            gap:10px;
            font-weight:500;
            font-size:13px;
            border-left:2px solid transparent;
        }
        .nav-item:hover { background:rgba(45,106,79,0.02); color:var(--text); }
        .nav-item.active {
            color:var(--secondary);
            background:rgba(45,106,79,0.04);
            border-left-color:var(--secondary);
        }
        .nav-item i { width:18px; text-align:center; font-size:14px; color:var(--muted); }
        .nav-item.active i { color:var(--secondary); }
        .nav-item .count {
            margin-left:auto;
            background:rgba(45,106,79,0.06);
            padding:0 8px;
            border-radius:30px;
            font-size:9px;
            color:var(--secondary);
            font-weight:600;
        }
        .nav-divider { border:none; border-top:1px solid var(--border); margin:8px 0; }

        /* ===== THEME TOGGLE IN SIDEBAR ===== */
        .theme-toggle-sidebar {
            padding:8px 12px;
            margin:2px 0;
            border-radius:10px;
            cursor:pointer;
            color:var(--text-secondary);
            transition:var(--transition);
            display:flex;
            align-items:center;
            gap:10px;
            font-weight:500;
            font-size:13px;
            border-left:2px solid transparent;
            background:transparent;
            border:none;
            width:100%;
        }
        .theme-toggle-sidebar:hover { background:rgba(45,106,79,0.02); color:var(--text); }
        .theme-toggle-sidebar i { width:18px; text-align:center; font-size:14px; color:var(--muted); }

        /* ===== MAIN CONTENT ===== */
        .main {
            flex:1;
            padding:16px 20px;
            overflow-y:auto;
            background:var(--bg);
            transition: background 0.3s;
        }
        .main::-webkit-scrollbar { width:4px; }
        .main::-webkit-scrollbar-track { background:transparent; }
        .main::-webkit-scrollbar-thumb { background:var(--secondary); border-radius:10px; }

        /* ===== CARDS ===== */
        .card-glass {
            background:var(--bg-card);
            border-radius:var(--radius);
            padding:16px;
            margin-bottom:14px;
            border:1px solid var(--border);
            box-shadow:var(--shadow);
            transition:var(--transition);
        }
        .card-glass:hover { border-color:rgba(45,106,79,0.12); box-shadow:var(--shadow-hover); }
        .card-glass .title {
            font-size:17px;
            font-weight:700;
            color:var(--primary);
            margin-bottom:12px;
            display:flex;
            align-items:center;
            gap:8px;
        }
        .card-glass .title i { font-size:15px; color:var(--secondary); }

        /* ===== BUTTONS ===== */
        .btn-primary {
            background:var(--secondary);
            border:none;
            padding:6px 16px;
            border-radius:40px;
            font-weight:600;
            color:#fff;
            cursor:pointer;
            transition:var(--transition);
            font-size:12px;
            box-shadow:0 4px 15px rgba(45,106,79,0.1);
            display:inline-flex;
            align-items:center;
            gap:5px;
        }
        .btn-primary:hover { background:var(--secondary-light); transform:translateY(-1px); box-shadow:0 6px 25px rgba(45,106,79,0.18); }
        .btn-primary:active { transform:scale(0.97); }
        .btn-primary-sm { padding:4px 12px; font-size:11px; }
        .btn-primary:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

        .btn-outline {
            background:transparent;
            border:1px solid var(--border);
            color:var(--text-secondary);
            padding:5px 14px;
            border-radius:40px;
            cursor:pointer;
            transition:var(--transition);
            font-size:12px;
            display:inline-flex;
            align-items:center;
            gap:5px;
        }
        .btn-outline:hover { border-color:var(--secondary); color:var(--secondary); background:rgba(45,106,79,0.02); }

        .btn-danger { background:#dc2626; color:#fff; border:none; }
        .btn-success { background:#10b981; color:#fff; border:none; }

        .btn-google {
            background:#ffffff;
            border:1px solid var(--border);
            color:var(--text-secondary);
            padding:12px 24px;
            border-radius:40px;
            font-weight:600;
            cursor:pointer;
            transition:var(--transition);
            font-size:14px;
            width:100%;
            text-align:center;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:10px;
            box-shadow:var(--shadow);
            margin-top:8px;
        }
        .btn-google:hover { border-color:var(--secondary); color:var(--text); transform:translateY(-1px); box-shadow:var(--shadow-hover); }
        .btn-google i { font-size:20px; color:#EA4335; }

        /* ===== INPUTS ===== */
        .input-glass {
            background:var(--bg);
            border:1px solid var(--border);
            padding:7px 12px;
            border-radius:10px;
            color:var(--text);
            width:100%;
            font-size:13px;
            outline:none;
            transition:var(--transition);
        }
        .input-glass:focus { border-color:var(--secondary); box-shadow:0 0 0 3px rgba(45,106,79,0.06); }
        .input-glass::placeholder { color:var(--muted); }
        select.input-glass { appearance:none; }
        textarea.input-glass { resize:vertical; min-height:50px; }

        .pw-wrap { position:relative; }
        .pw-wrap .input-glass { padding-right:40px; }
        .pw-toggle {
            position:absolute;
            right:12px;
            top:50%;
            transform:translateY(-50%);
            background:none;
            border:none;
            color:var(--secondary);
            cursor:pointer;
            font-size:14px;
        }

        /* ===== TABLES ===== */
        .table-wrap { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; font-size:13px; }
        th {
            text-align:left;
            padding:8px 6px;
            color:var(--text-secondary);
            font-weight:600;
            border-bottom:1px solid var(--border);
        }
        td { padding:8px 6px; border-bottom:1px solid rgba(26,26,46,0.02); vertical-align:middle; }
        tr:hover td { background:rgba(45,106,79,0.01); }

        /* ===== BADGES ===== */
        .badge-status {
            padding:2px 10px;
            border-radius:30px;
            font-size:9px;
            font-weight:600;
            display:inline-block;
        }
        .badge-pending { background:rgba(245,158,11,0.08); color:#f59e0b; border:1px solid rgba(245,158,11,0.12); }
        .badge-approved { background:rgba(16,185,129,0.08); color:#10b981; border:1px solid rgba(16,185,129,0.12); }
        .badge-rejected { background:rgba(220,38,38,0.08); color:#dc2626; border:1px solid rgba(220,38,38,0.12); }
        .badge-active { background:rgba(16,185,129,0.08); color:#10b981; border:1px solid rgba(16,185,129,0.12); }
        .badge-inactive { background:rgba(220,38,38,0.08); color:#dc2626; border:1px solid rgba(220,38,38,0.12); }
        .badge-online { background:rgba(16,185,129,0.08); color:#10b981; border:1px solid rgba(16,185,129,0.12); }
        .badge-offline { background:var(--bg); color:var(--muted); border:1px solid var(--border); }

        /* ===== VIP ===== */
        .vip-1 { background:#e8e8ed; color:var(--text-secondary); padding:2px 8px; border-radius:20px; font-size:9px; font-weight:700; display:inline-block; }
        .vip-2 { background:#d4edda; color:#1e7e34; }
        .vip-3 { background:#cce5ff; color:#0f6b7a; }
        .vip-4 { background:linear-gradient(135deg,#D4AF37,#F5E7B2); color:#0a120e; }

        /* ===== INJECTION ITEM ===== */
        .inj-item {
            background:var(--bg);
            padding:8px 12px;
            border-radius:10px;
            margin-bottom:6px;
            border-left:3px solid var(--secondary);
            transition:var(--transition);
        }
        .inj-item:hover { background:rgba(45,106,79,0.02); }

        /* ===== MODAL ===== */
        .modal-overlay {
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(26,26,46,0.5);
            backdrop-filter:blur(6px);
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:2000;
            padding:16px;
        }
        .modal-box {
            background:var(--bg-card);
            border-radius:var(--radius);
            padding:20px;
            width:92%;
            max-width:480px;
            max-height:85vh;
            overflow-y:auto;
            border:1px solid var(--secondary);
            box-shadow:var(--shadow-hover);
        }
        .modal-box .modal-title {
            font-size:17px;
            font-weight:700;
            color:var(--primary);
            margin-bottom:12px;
            display:flex;
            align-items:center;
            gap:8px;
        }
        .modal-box .modal-title i { color:var(--secondary); }

        /* ===== CHAT ===== */
        .chat-wrap {
            display:flex;
            flex-direction:column;
            height:50vh;
            background:var(--bg);
            border-radius:var(--radius);
            overflow:hidden;
            border:1px solid var(--border);
        }
        .chat-msgs {
            flex:1;
            overflow-y:auto;
            padding:12px;
            display:flex;
            flex-direction:column;
            gap:5px;
        }
        .chat-msg {
            max-width:80%;
            padding:6px 12px;
            border-radius:14px;
            font-size:13px;
            line-height:1.4;
            word-break:break-word;
        }
        .chat-msg.sent {
            align-self:flex-end;
            background:var(--secondary);
            color:#fff;
            border-bottom-right-radius:3px;
        }
        .chat-msg.received {
            align-self:flex-start;
            background:var(--bg);
            border:1px solid var(--border);
            border-bottom-left-radius:3px;
        }
        .chat-msg .time { font-size:8px; opacity:0.4; margin-top:2px; text-align:right; }
        .chat-msg img { max-width:120px; max-height:80px; border-radius:6px; margin-top:3px; border:1px solid var(--secondary); cursor:pointer; }
        .chat-input {
            display:flex;
            gap:5px;
            padding:8px 10px;
            background:var(--bg-card);
            border-top:1px solid var(--border);
            align-items:center;
        }
        .chat-input .input-glass { margin:0; flex:1; padding:6px 12px; font-size:12px; min-height:34px; }
        .chat-input .btn-primary { width:auto; padding:6px 16px; font-size:12px; min-height:34px; }

        /* ===== RESPONSIVE ===== */
        @media(max-width:768px) {
            .sidebar {
                width:100%;
                max-height:48px;
                flex-direction:row;
                overflow-x:auto;
                padding:4px 8px;
                border-right:none;
                border-bottom:1px solid var(--border);
                height:auto;
                position:relative;
            }
            .sidebar-brand { display:none; }
            .nav-item {
                white-space:nowrap;
                margin:0 2px;
                padding:4px 8px;
                font-size:11px;
                flex-shrink:0;
                border-left:none;
            }
            .nav-item .count { display:none; }
            .theme-toggle-sidebar { display:none; }
            .main { padding:10px; }
            .card-glass { padding:12px; }
            .modal-box { padding:14px; }
            .chat-wrap { height:40vh; }
        }
        @media(max-width:480px) {
            .main { padding:6px; }
            .card-glass { padding:8px; }
            .table-wrap { font-size:11px; }
            th, td { padding:4px 3px; }
            .btn-primary { font-size:10px; padding:4px 10px; }
        }

        /* ===== LOGIN SCREEN ===== */
        .login-screen {
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:var(--bg);
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:3000;
        }
        .login-box {
            background:var(--bg-card);
            padding:28px;
            border-radius:24px;
            width:380px;
            max-width:92%;
            border:1px solid var(--secondary);
            box-shadow:var(--shadow-hover);
        }
        .login-box .brand { text-align:center; margin-bottom:20px; }
        .login-box .brand .logo-plane {
            width:60px; height:60px;
            background:var(--secondary);
            border-radius:16px;
            display:flex;
            align-items:center;
            justify-content:center;
            margin:0 auto 8px;
            font-size:26px;
            color:#fff;
            box-shadow:0 4px 25px rgba(45,106,79,0.1);
        }
        .login-box .brand .name {
            font-size:28px;
            font-weight:800;
            color:var(--primary);
        }
        .login-box .brand .sub {
            font-size:12px;
            color:var(--muted);
        }
        .login-box .input-glass { margin-bottom:10px; }
        .login-box .btn-primary { width:100%; padding:10px; justify-content:center; }
        .login-box .error { color:#dc2626; text-align:center; margin-top:8px; font-size:12px; }

        /* ===== TOAST ===== */
        .toast-msg {
            position:fixed;
            bottom:76px;
            left:50%;
            transform:translateX(-50%);
            background:var(--primary);
            padding:6px 18px;
            border-radius:40px;
            font-size:11px;
            z-index:100;
            font-weight:600;
            color:#fff;
            box-shadow:0 4px 20px rgba(26,26,46,0.15);
            max-width:92%;
            text-align:center;
        }
        .toast-msg.error { background:#dc2626; }

        /* ===== LIVE INDICATOR ===== */
        .live-indicator {
            position:fixed;
            bottom:20px;
            right:16px;
            background:rgba(16,185,129,0.8);
            color:#fff;
            padding:2px 10px;
            border-radius:30px;
            font-size:8px;
            z-index:100;
            animation:pulse 1.5s infinite;
            display:none;
        }

        /* ===== UTILITY ===== */
        .flex { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; }
        .gap-1 { gap:4px; }
        .mt-1 { margin-top:6px; }
        .mb-1 { margin-bottom:6px; }
        .text-muted { color:var(--muted); }
        .text-center { text-align:center; }
        .w-full { width:100%; }

        .img-preview {
            max-width:70px;
            max-height:70px;
            border-radius:6px;
            border:1px solid var(--secondary);
            cursor:pointer;
        }
        .img-preview-sm {
            max-width:50px;
            max-height:50px;
            border-radius:4px;
            border:1px solid var(--secondary);
            cursor:pointer;
        }

        .online-dot {
            display:inline-block;
            width:6px;
            height:6px;
            border-radius:50%;
            margin-right:4px;
        }
        .online-dot.online { background:#10b981; animation:pulse 1.5s infinite; }
        .online-dot.offline { background:var(--muted); }

        /* ===== SKELETON ===== */
        .skeleton {
            background: var(--skeleton-base);
            border-radius: 8px;
            animation: shimmer 1.2s ease-in-out infinite;
            background-image: linear-gradient(90deg, var(--skeleton-base) 25%, var(--skeleton-highlight) 50%, var(--skeleton-base) 75%);
            background-size: 200% 100%;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton-text { height: 14px; width: 100%; margin-bottom: 8px; }
        .skeleton-text.short { width: 60%; }
        .skeleton-circle { width: 50px; height: 50px; border-radius: 50%; }
        .skeleton-box { height: 80px; width: 100%; border-radius: 12px; }
    </style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="loginScreen" class="login-screen">
    <div class="login-box">
        <div class="brand">
            <div class="logo-plane"><i class="fas fa-plane"></i></div>
            <div class="name">Trip.com</div>
            <div class="sub">Admin Panel</div>
        </div>
        <input type="text" class="input-glass" id="loginUser" placeholder="Username">
        <div class="pw-wrap">
            <input type="password" class="input-glass" id="loginPass" placeholder="Password">
            <button class="pw-toggle" id="loginToggle"><i class="fas fa-eye"></i></button>
        </div>
        <button class="btn-primary" id="loginBtn"><i class="fas fa-arrow-right-to-bracket"></i> Login</button>
        
        <div style="position:relative;margin:16px 0 8px;width:100%;">
            <div style="border-top:1px solid var(--border);position:absolute;top:50%;left:0;right:0;"></div>
            <span style="background:var(--bg-card);position:relative;padding:0 12px;color:var(--muted);font-size:11px;">or</span>
        </div>
        <button class="btn-google" id="loginGoogleBtn"><i class="fab fa-google"></i> Sign in with Google</button>
        
        <div id="loginError" class="error"></div>
    </div>
</div>

<!-- ===== ADMIN PANEL ===== -->
<div id="adminPanel" style="display:none;">
    <div class="admin-wrap">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <div class="logo-plane"><i class="fas fa-plane"></i></div>
                <div class="logo-text-name">Trip.com</div>
                <span class="dot"></span>
            </div>
            <div class="nav-item active" data-section="dashboard"><i class="fas fa-chart-pie"></i> Dashboard</div>
            <div class="nav-item" data-section="members"><i class="fas fa-users"></i> Members <span class="count" id="memberCount">0</span></div>
            <div class="nav-item" data-section="vip"><i class="fas fa-star"></i> VIP</div>
            <div class="nav-item" data-section="injection"><i class="fas fa-syringe"></i> Injection</div>
            <div class="nav-item" data-section="orders"><i class="fas fa-plus-circle"></i> Orders</div>
            <div class="nav-item" data-section="recharge"><i class="fas fa-coins"></i> Recharge</div>
            <div class="nav-item" data-section="withdraw"><i class="fas fa-hand-holding-usd"></i> Withdraw</div>

    function compressImage(file, maxWidth = 400, maxHeight = 400, quality = 0.5) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth || height > maxHeight) {
                        if (width > height) {
                            height = Math.round(height * maxWidth / width);
                            width = maxWidth;
                        } else {
                            width = Math.round(width * maxHeight / height);
                            height = maxHeight;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

        switch(section) {
            case 'dashboard': renderDashboard(main); break;
            case 'members': renderMembers(main); break;
            case 'vip': renderVIP(main); break;
            case 'injection': renderInjection(main); break;
            case 'orders': renderOrders(main); break;
            case 'recharge': renderRecharge(main); break;
            case 'withdraw': renderWithdraw(main); break;
            case 'loans': renderLoans(main); break;
            case 'agency': renderAgency(main); break;
            case 'settings': renderSettings(main); break;
            case 'popup': renderPopup(main); break;
            case 'chat': renderChat(main); break;
            case 'notifications': renderNotifications(main); break;

        }
    }

    // ===== MEMBERS =====

            tbody.innerHTML = filtered.map(u => {
                const lv = getVIP(u.balance||0);
                const vc = getVipClass(lv);
                const isOnline = u.lastSeen && (Date.now() - u.lastSeen < 60000);
                const lastSeenTime = u.lastSeen ? new Date(u.lastSeen).toLocaleString('en-US', { timeZone: 'Asia/Bangkok', hour12: false }) : 'Never';
                return `<tr>

                    <td><strong>S$ ${(u.balance||0).toFixed(2)}</strong><br><span style="font-size:9px;color:var(--muted);">Credit: ${u.creditScore||100}</span></td>
                    <td><span class="${vc}">VIP ${lv}</span></td>
                    <td><span class="badge-status ${u.disabled ? 'badge-inactive' : 'badge-active'}">${u.disabled ? 'Disabled' : 'Active'}</span></td>
                    <td style="font-size:11px;"><span class="online-dot ${isOnline ? 'online' : 'offline'}"></span>${isOnline ? 'Online' : lastSeenTime}</td>
                    <td>
                        <div class="flex gap-1" style="flex-wrap:wrap;">
                            <button class="btn-primary btn-primary-sm" onclick="window.setupOrder('${u.id}')" title="Orders">📦</button>
                            <button class="btn-primary btn-primary-sm" onclick="window.setupBalance('${u.id}')" title="Balance">💰</button>
                            <button class="btn-primary btn-primary-sm" onclick="window.changeLogin('${u.id}')" title="Login PW">🔑</button>
                            <button class="btn-primary btn-primary-sm" onclick="window.changeWithdraw('${u.id}')" title="Withdraw PW">💳</button>
                            <button class="btn-primary btn-primary-sm" onclick="window.adjustCredit('${u.id}')" title="Credit">⭐</button>
                            <button class="btn-primary btn-primary-sm" onclick="window.changeWallet('${u.id}')" title="Wallet">🏦</button>
                            <button class="btn-primary btn-primary-sm" style="background:${u.disabled ? '#10b981' : '#dc2626'};" onclick="window.toggleDisable('${u.id}')">${u.disabled ? 'Enable' : 'Disable'}</button>

                    </td>
                </tr>`;
            }).join('');
        }
        renderTable();
        document.getElementById('searchBtn').onclick = () => renderTable(document.getElementById('memberSearch').value);
        document.getElementById('resetSearch').onclick = () => { document.getElementById('memberSearch').value = ''; renderTable(); };
        document.getElementById('addMemberBtn').onclick = showAddMember;
    }

    window.setupOrder = async (id) => {
        const u = users.find(x => x.id === id);
        if (!u) return;
        const c = parseInt(prompt('Add/remove orders (+/-):', 0));
        if (!isNaN(c)) {
            if (!u.tasks) u.tasks = { completed:0, total:0 };
            if (c > 0) u.tasks.total += c;
            else if (c < 0) {
                const r = Math.abs(c);
                if (u.tasks.total >= r) { u.tasks.total -= r; if (u.tasks.completed > u.tasks.total) u.tasks.completed = u.tasks.total; }
            }
            await updateDoc(doc(db,'users',id), { tasks: u.tasks });
            toast('Orders updated');
            renderSection('members');
        }
    };
    window.setupBalance = async (id) => {
        const u = users.find(x => x.id === id);
        if (!u) return;
        const b = prompt('New balance:', u.balance);
        if (b && !isNaN(parseFloat(b))) {
            await updateDoc(doc(db,'users',id), { balance: parseFloat(b) });
            toast('Balance updated');
            renderSection('members');
        }
    };
    window.changeLogin = async (id) => {
        const u = users.find(x => x.id === id);
        if (!u) return;
        const p = prompt('New login password:');
        if (p) { await updateDoc(doc(db,'users',id), { password: p }); toast('Password updated'); renderSection('members'); }
    };
    window.changeWithdraw = async (id) => {
        const u = users.find(x => x.id === id);
        if (!u) return;
        const p = prompt('New withdraw password:');
        if (p) { await updateDoc(doc(db,'users',id), { withdrawPassword: p }); toast('Withdraw password updated'); renderSection('members'); }
    };
    window.adjustCredit = async (id) => {
        const u = users.find(x => x.id === id);
        if (!u) return;
        const a = parseInt(prompt('Add/remove credit (+/-):', 0));
        if (!isNaN(a)) {
            const newScore = (u.creditScore||100) + a;
            await updateDoc(doc(db,'users',id), { creditScore: newScore });
            toast('Credit updated');
            renderSection('members');
        }
    };
    window.changeWallet = async (id) => {
        const u = users.find(x => x.id === id);
        if (!u) return;
        const w = prompt('USDT wallet address:', u.walletAddress||'');
        if (w !== null && w.trim()) {
            await updateDoc(doc(db,'users',id), { walletAddress: w.trim() });
            toast('Wallet updated');
            renderSection('members');
        }
    };
    window.toggleDisable = async (id) => {
        const u = users.find(x => x.id === id);
        if (!u) return;
        await updateDoc(doc(db,'users',id), { disabled: !u.disabled });
        toast(u.disabled ? 'Enabled' : 'Disabled');
        renderSection('members');
    };

    async function showAddMember() {
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.innerHTML = `
            <div class="modal-box">
                <div class="modal-title"><i class="fas fa-user-plus"></i> Add Member</div>
                <input class="input-glass" id="amUsername" placeholder="Username">
                <input class="input-glass" id="amEmail" placeholder="Email">
                <input class="input-glass" id="amPhone" placeholder="Phone">
                <div class="pw-wrap"><input type="password" class="input-glass" id="amPass" placeholder="Login Password"><button class="pw-toggle" onclick="togglePw('amPass',this)"><i class="fas fa-eye"></i></button></div>
                <div class="pw-wrap"><input type="password" class="input-glass" id="amWpass" placeholder="Withdraw Password"><button class="pw-toggle" onclick="togglePw('amWpass',this)"><i class="fas fa-eye"></i></button></div>
                <input class="input-glass" id="amInvite" placeholder="Invitation Code (optional)">
                <div class="flex gap-1" style="margin-top:8px;">
                    <button class="btn-primary" id="amSubmit">Create</button>
                    <button class="btn-outline" id="amCancel">Cancel</button>
                </div>
                <div id="amStatus" style="text-align:center;margin-top:6px;font-size:12px;"></div>
            </div>
        `;
        document.body.appendChild(modal);
        document.getElementById('amSubmit').onclick = async () => {
            const un = document.getElementById('amUsername').value.trim();
            const em = document.getElementById('amEmail').value.trim();
            const ph = document.getElementById('amPhone').value.trim();
            const p = document.getElementById('amPass').value;
            const wp = document.getElementById('amWpass').value;
            const inv = document.getElementById('amInvite').value.trim();
            if (!un || !em || !p || !wp) {
                document.getElementById('amStatus').innerHTML = '<span style="color:#dc2626;">Required fields missing</span>';
                return;
            }
            if (users.find(x => x.username === un)) {
                document.getElementById('amStatus').innerHTML = '<span style="color:#dc2626;">Username exists</span>';
                return;
            }
            let ref = null;
            if (inv) {
                const r = users.find(x => x.invitationCode === inv);
                if (!r) { document.getElementById('amStatus').innerHTML = '<span style="color:#dc2626;">Invalid invite code</span>'; return; }
                ref = r.username;
            }
            const data = {
                id: Date.now().toString(),
                username: un, email: em, phone: ph,
                password: p, withdrawPassword: wp,
                balance: 0,
                invitationCode: 'LXC'+Math.random().toString(36).substring(2,8).toUpperCase(),
                superior: ref,
                referralEarnings: 0,
                regTime: new Date().toISOString(),
                tasks: { completed:0, total:0 },
                orders: [],
                todayOrders: 0,
                todayEarnings: 0,
                totalCommission: 0,
                creditScore: 100,
                disabled: false,
                walletAddress: null,
                currentOrderObj: null,
                role: 'customer',
                lastSeen: null,
                regIP: null
            };
            await setDoc(doc(db,'users',data.id), data);
            document.getElementById('amStatus').innerHTML = '<span style="color:#10b981;">✅ Added!</span>';
            setTimeout(() => { document.body.removeChild(modal); renderSection('members'); }, 700);
        };
        document.getElementById('amCancel').onclick = () => document.body.removeChild(modal);
    }

    window.applyVIP = async (id) => {
        const u = users.find(x => x.id === id);
        if (!u) return;
        const sel = document.getElementById(`vipSel_${id}`);
        if (!sel) return;
        const val = parseInt(sel.value);
        if (val === 0) {
            if (u.manualVIPLevel) {
                await updateDoc(doc(db,'users',id), { manualVIPLevel: delete u.manualVIPLevel });
                toast('Auto mode');
            } else toast('Already auto');
        } else {
            await updateDoc(doc(db,'users',id), { manualVIPLevel: val });
            toast(`VIP ${val} set`);
        }
        renderSection('vip');
    };

                <div id="ordList"></div>
            </div>
        `;

            if (e.target.files[0]) {

                document.getElementById('ordPreview').innerHTML = `<img src="${data}" class="img-preview">`;
            }
        };

            const price = parseFloat(document.getElementById('ordPrice').value) || 0;

            const file = document.getElementById('ordImg').files[0];

                const imgData = await compressImage(file, 200, 200, 0.4);
                data.image = imgData;
                await setDoc(doc(db,'customOrders',data.id), data);
                toast('Order added');
                renderSection('orders');
            } else {
                await setDoc(doc(db,'customOrders',data.id), data);
                toast('Order added');
                renderSection('orders');
            }
        };
        renderOrderList();

        container.innerHTML = customOrders.map((o,i) => `
            <div class="flex" style="padding:6px 10px;background:var(--bg);border-radius:8px;margin-bottom:4px;border:1px solid var(--border);">
                <div style="display:flex;align-items:center;gap:8px;">
                    ${o.image ? `<img src="${o.image}" class="img-preview-sm">` : '<i class="fas fa-box" style="color:var(--secondary);"></i>'}

                </div>
                <button class="btn-primary btn-primary-sm" style="background:#dc2626;color:#fff;" onclick="window.deleteOrder('${o.id}')"><i class="fas fa-trash"></i></button>
            </div>
        `).join('');
    }

    window.deleteOrder = async (id) => {
        if (!confirm('Delete this order?')) return;
        await deleteDoc(doc(db,'customOrders',id));
        customOrders = customOrders.filter(o => o.id !== id);

                const data = { title, subtitle: sub, imageData: img || existing?.imageData || null, isActive: active };
                if (isEdit) {
                    await setDoc(doc(db,'popupAds',existing.id), { ...data, id: existing.id, createdAt: existing.createdAt, updatedAt: new Date().toISOString() });
                    popupAds = popupAds.map(x => x.id === existing.id ? { ...data, id: existing.id, createdAt: existing.createdAt } : x);
                    status.innerHTML = '<span style="color:#10b981;">✅ Updated</span>';
                } else {
                    const id = Date.now().toString();
                    await setDoc(doc(db,'popupAds',id), { ...data, id, createdAt: new Date().toISOString() });
                    popupAds.push({ ...data, id });
                    status.innerHTML = '<span style="color:#10b981;">✅ Created</span>';
                }
                setTimeout(() => { document.body.removeChild(modal); renderSection('popup'); }, 700);
            };
            if (file) {
                const imgData = await compressImage(file, 400, 400, 0.5);
                save(imgData);
            } else save(null);
        };
        document.getElementById('popCancel').onclick = () => document.body.removeChild(modal);
    }

    // ===== CHAT =====
    function renderChat(main) {
        const customers = users.filter(u => u.role !== 'admin' && u.role !== 'agency' && !u.disabled);
        main.innerHTML = `
            <div class="card-glass">
                <div class="title"><i class="fas fa-comment-dots"></i> Customer Chat</div>
                <select class="input-glass" id="chatSelect" style="margin-bottom:6px;">
                    <option value="">-- Select Customer --</option>
                    ${customers.map(u => `<option value="${esc(u.username)}">${esc(u.username)} (${u.email||''})</option>`).join('')}
                </select>
                <div class="chat-wrap">
                    <div class="chat-msgs" id="chatMsgs"></div>
                    <div class="chat-input">
                        <input type="text" class="input-glass" id="chatInput" placeholder="Type..." style="margin:0;flex:1;padding:6px 12px;font-size:12px;min-height:34px;">
                        <button class="btn-primary" id="chatSend" style="width:auto;padding:6px 16px;font-size:12px;min-height:34px;">Send</button>
                    </div>
                </div>
            </div>
        `;
        document.getElementById('chatSelect').onchange = function() {
            chatUser = this.value;
            if (chatUser) {
                document.getElementById('chatMsgs').innerHTML = '<div style="text-align:center;padding:10px;color:var(--muted);">Loading...</div>';
                if (unsubChat) unsubChat();
                const q = query(collection(db,'chatMessages'), orderBy('id','asc'));
                unsubChat = onSnapshot(q, (snap) => {
                    const container = document.getElementById('chatMsgs');
                    if (!container || !chatUser) return;
                    const msgs = [];
                    snap.forEach(d => {
                        const m = d.data();
                        if (m.type !== 'notification' && ((m.to === 'admin' && m.from === chatUser) || (m.from === 'admin' && m.to === chatUser))) {
                            msgs.push(m);
                        }
                    });
                    msgs.sort((a,b) => a.id - b.id);
                    container.innerHTML = msgs.length ? msgs.map(m => {
                        const isSent = m.from === 'admin';
                        const msgTime = m.time ? new Date(m.time).toLocaleString([], { hour12: false }) : '';
                        return `
                            <div class="chat-msg ${isSent ? 'sent' : 'received'}">
                                <div>${esc(m.text||'')}</div>
                                ${m.image ? `<img src="${m.image}" onclick="window.open(this.src)">` : ''}
                                <div class="time">${msgTime}</div>
                            </div>
                        `;
                    }).join('') : '<div style="text-align:center;padding:10px;color:var(--muted);">No messages</div>';
                    container.scrollTop = container.scrollHeight;
                });
            }
        };
        document.getElementById('chatSend').onclick = async () => {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !chatUser) { if (!chatUser) toast('Select customer', true); return; }
            await setDoc(doc(db,'chatMessages',(Date.now()+Math.random()).toString()), {
                id: Date.now() + Math.random(),
                from: 'admin',
                to: chatUser,
                text: text,
                image: null,
                time: new Date().toISOString(),
                read: false,
                type: 'message'
            });
            input.value = '';
            input.focus();
        };
        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('chatSend').click();
        });
    }

    // ===== NOTIFICATIONS (System Announcement) =====
    function renderNotifications(main) {
        const customers = users.filter(u => u.role !== 'admin' && u.role !== 'agency' && !u.disabled);
        main.innerHTML = `
            <div class="card-glass">
                <div class="flex">
                    <div class="title"><i class="fas fa-bullhorn"></i> System Announcements</div>
                </div>
                <div style="margin-bottom:8px;">
                    <label style="font-size:12px;color:var(--text-secondary);">Select Customer</label>
                    <select class="input-glass" id="notifUserSelect">
                        <option value="all">All Customers</option>
                        ${customers.map(u => `<option value="${esc(u.username)}">${esc(u.username)} (${u.email||''})</option>`).join('')}
                    </select>
                </div>
                <div style="margin-bottom:8px;">
                    <label style="font-size:12px;color:var(--text-secondary);">Title</label>
                    <input type="text" class="input-glass" id="notifTitle" placeholder="Ex: New Update, Bonus Offer...">
                </div>
                <div style="margin-bottom:8px;">
                    <label style="font-size:12px;color:var(--text-secondary);">Message</label>
                    <textarea class="input-glass" id="notifMessage" rows="3" placeholder="Write your announcement here..."></textarea>
                </div>
                <button class="btn-primary" id="sendNotifBtn"><i class="fas fa-paper-plane"></i> Send Announcement</button>
                <div id="notifStatus" style="text-align:center;margin-top:8px;font-size:12px;"></div>
            </div>
        `;

        document.getElementById('sendNotifBtn').onclick = async () => {
            const username = document.getElementById('notifUserSelect').value;
            const title = document.getElementById('notifTitle').value.trim();
            const message = document.getElementById('notifMessage').value.trim();

            if (!title || !message) {
                document.getElementById('notifStatus').innerHTML = '<span style="color:#dc2626;">Please fill in both Title and Message.</span>';
                return;
            }

            const btn = document.getElementById('sendNotifBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Sending...';
            document.getElementById('notifStatus').innerHTML = '';

            try {
                const targets = username === 'all' 
                    ? users.filter(u => u.role === 'customer' && !u.disabled).map(u => u.username)
                    : [username];

                for (let target of targets) {
                    await setDoc(doc(db, 'chatMessages', (Date.now() + Math.random() + target).toString()), {
                        id: Date.now() + Math.random() + target,
                        from: 'admin',
                        to: target,
                        text: `[NOTIFICATION] ${title}\n\n${message}`,
                        image: null,
                        time: new Date().toISOString(),
                        read: false,
                        type: 'notification'  // <-- THIS IS CRITICAL FOR CUSTOMER TO SHOW AS SYSTEM ANNOUNCEMENT
                    });
                }

                document.getElementById('notifStatus').innerHTML = `<span style="color:#10b981;">✅ Announcement sent successfully!</span>`;
                document.getElementById('notifTitle').value = '';
                document.getElementById('notifMessage').value = '';
                toast('Announcement sent!');
            } catch (e) {
                document.getElementById('notifStatus').innerHTML = `<span style="color:#dc2626;">Error: ${e.message}</span>`;
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Announcement';
        };
    }

    // ============================================================
    // ===== NAVIGATION =====
    // ============================================================
    document.querySelectorAll('.nav-item').forEach(el => {
        el.onclick = function() {
            const section = this.dataset.section;
            if (!section) return;
            showLoader();
            renderSection(section);
        };
    });

    document.getElementById('logoutBtn').onclick = () => {
        if (unsubChat) unsubChat();
        if (unsubUsers) unsubUsers();
        if (unsubInjections) unsubInjections();
        admin = null;
        sessionStorage.removeItem('adminSession');
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('loginUser').value = '';
        document.getElementById('loginPass').value = '';
        firebaseSignOut(auth).then(() => {
            console.log("Signed out from Firebase");
        }).catch((error) => {
            console.error("Sign out error:", error);
        });
    };

    // ============================================================
    // ===== INIT =====
    // ============================================================
    loadTheme();

    if (checkSession()) {
        (async () => {
            await loadAllData();
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            startSubscriptions();
            const saved = localStorage.getItem('adminSection');
            renderSection(saved || 'dashboard');
        })();
    }

    console.log('Trip.com Admin Panel loaded successfully!');
</script>
</body>
</html>
