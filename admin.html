    // ===== COMPRESS IMAGE =====
    async function compressImage(file, maxWidth = 400, maxHeight = 400, quality = 0.5) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth || height > maxHeight) {
                        if (width > height) {
                            height = Math.round(height * maxWidth / width);
                            width = maxWidth;
                        } else {
                            width = Math.round(width * maxHeight / height);
                            height = maxHeight;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    // ===== DATA LOADING =====
    function loadBaseData() {
        getDoc(doc(db,'systemSettings','main')).then(snap => {
            if (snap.exists()) cachedData.systemSettings = snap.data();
        }).catch(console.error);
        getDocs(collection(db,'agencies')).then(snap => {
            cachedData.agencies = []; snap.forEach(d => cachedData.agencies.push({ id:d.id, ...d.data() }));
        }).catch(console.error);
        getDocs(collection(db,'customOrders')).then(snap => {
            cachedData.customOrders = []; snap.forEach(d => cachedData.customOrders.push({ id:d.id, ...d.data() }));
        }).catch(console.error);
        getDocs(collection(db,'popupAds')).then(snap => {
            cachedData.popupAds = []; snap.forEach(d => cachedData.popupAds.push({ id:d.id, ...d.data() }));
        }).catch(console.error);

    function loadSectionData(section) {
        if (unsubscribers[section]) {
            unsubscribers[section]();
            delete unsubscribers[section];
        }

        switch(section) {
            case 'dashboard':
            case 'users':
            case 'vip':
            case 'injection':
                if (!unsubscribers['users']) {
                    unsubscribers['users'] = onSnapshot(query(collection(db,'users'), limit(500)), (snap) => {
                        cachedData.users = [];
                        snap.forEach(d => cachedData.users.push({ id:d.id, ...d.data() }));
                        const total = cachedData.users.filter(u => u.role !== 'admin' && u.role !== 'agency').length;
                        document.getElementById('memberCount')?.textContent = total;
                        if (['dashboard','users','vip','injection'].includes(currentSection)) {
                            renderSection(currentSection);
                        }
                        const ind = document.getElementById('realTimeIndicator');
                        if (ind) { ind.style.display = 'flex'; setTimeout(() => { if(ind) ind.style.display = 'none'; }, 1200); }
                    });
                }
                break;
            case 'rechargeRequests':
                if (!unsubscribers['recharge']) {
                    unsubscribers['recharge'] = onSnapshot(query(collection(db,'rechargeRequests'), orderBy('timestamp','desc'), limit(200)), (snap) => {
                        cachedData.rechargeReqs = [];
                        snap.forEach(d => cachedData.rechargeReqs.push({ id:d.id, ...d.data() }));
                        if (currentSection === 'rechargeRequests') renderSection('rechargeRequests');
                    });
                }
                break;
            case 'withdrawRequests':
                if (!unsubscribers['withdraw']) {
                    unsubscribers['withdraw'] = onSnapshot(query(collection(db,'withdrawRequests'), orderBy('timestamp','desc'), limit(200)), (snap) => {
                        cachedData.withdrawReqs = [];
                        snap.forEach(d => cachedData.withdrawReqs.push({ id:d.id, ...d.data() }));
                        if (currentSection === 'withdrawRequests') renderSection('withdrawRequests');
                    });
                }
                break;
            case 'loanRequests':
                if (!unsubscribers['loans']) {
                    unsubscribers['loans'] = onSnapshot(query(collection(db,'loanRequests'), orderBy('timestamp','desc'), limit(200)), (snap) => {
                        cachedData.loanReqs = [];
                        snap.forEach(d => cachedData.loanReqs.push({ id:d.id, ...d.data() }));
                        if (currentSection === 'loanRequests') renderSection('loanRequests');
                    });
                }
                break;
            case 'injection':
                if (!unsubscribers['injections']) {
                    unsubscribers['injections'] = onSnapshot(collection(db,'injections'), (snap) => {
                        cachedData.injections = [];
                        snap.forEach(d => cachedData.injections.push({ id:d.id, ...d.data() }));
                        if (currentSection === 'injection') renderSection('injection');
                    });
                }
                break;
            default:
                break;
        }
    }

    // ===== RENDER SECTIONS =====
    function renderSection(section) {
        currentSection = section;
        localStorage.setItem('adminSection', section);
        document.querySelectorAll('.nav-item').forEach(el => {
            el.classList.toggle('active', el.dataset.section === section);
        });
        loadSectionData(section);
        const main = document.getElementById('mainContent');
        switch(section) {
            case 'dashboard': renderDashboard(main); break;
            case 'users': renderUsers(main); break;
            case 'vip': renderVIP(main); break;
            case 'injection': renderInjection(main); break;
            case 'addOrder': renderOrders(main); break;
            case 'rechargeRequests': renderRecharge(main); break;
            case 'withdrawRequests': renderWithdraw(main); break;
            case 'loanRequests': renderLoans(main); break;
            case 'agency': renderAgency(main); break;
            case 'background': renderSettings(main); break;
            case 'chat': renderChat(main); break;
            default: main.innerHTML = '<div class="admin-card"><p>Section not found</p></div>';
        }
    }

    // ---- USER ACTIONS ----
    window.setupOrder = async (id) => {
        const u = cachedData.users.find(x => x.id === id);
        if (!u) return;
        const c = parseInt(prompt('Add/remove orders (+/-):', 0));
        if (!isNaN(c)) {
            if (!u.tasks) u.tasks = { completed:0, total:0 };
            if (c > 0) u.tasks.total += c;
            else if (c < 0) { const r = Math.abs(c); if (u.tasks.total >= r) { u.tasks.total -= r; if (u.tasks.completed > u.tasks.total) u.tasks.completed = u.tasks.total; } }
            await updateDoc(doc(db,'users',id), { tasks: u.tasks });
            toast('Orders updated');
            renderSection('users');
        }
    };
    window.setupBalance = async (id) => {
        const u = cachedData.users.find(x => x.id === id);
        if (!u) return;
        const b = prompt('New balance:', u.balance);
        if (b && !isNaN(parseFloat(b))) {
            await updateDoc(doc(db,'users',id), { balance: parseFloat(b) });
            toast('Balance updated');
            renderSection('users');
        }
    };
    window.changeLogin = async (id) => {
        const u = cachedData.users.find(x => x.id === id);
        if (!u) return;
        const p = prompt('New login password:');
        if (p) { await updateDoc(doc(db,'users',id), { password: p }); toast('Password updated'); renderSection('users'); }
    };
    window.changeWithdraw = async (id) => {
        const u = cachedData.users.find(x => x.id === id);
        if (!u) return;
        const p = prompt('New withdraw password:');
        if (p) { await updateDoc(doc(db,'users',id), { withdrawPassword: p }); toast('Withdraw password updated'); renderSection('users'); }
    };
    window.adjustCredit = async (id) => {
        const u = cachedData.users.find(x => x.id === id);
        if (!u) return;
        const a = parseInt(prompt('Add/remove credit (+/-):', 0));
        if (!isNaN(a)) { const newScore = (u.creditScore||100) + a; await updateDoc(doc(db,'users',id), { creditScore: newScore }); toast('Credit updated'); renderSection('users'); }
    };
    window.changeWallet = async (id) => {
        const u = cachedData.users.find(x => x.id === id);
        if (!u) return;
        const w = prompt('USDT wallet address:', u.walletAddress||'');
        if (w !== null && w.trim()) { await updateDoc(doc(db,'users',id), { walletAddress: w.trim() }); toast('Wallet updated'); renderSection('users'); }
    };
    window.toggleDisable = async (id) => {
        const u = cachedData.users.find(x => x.id === id);
        if (!u) return;
        await updateDoc(doc(db,'users',id), { disabled: !u.disabled });
        toast(u.disabled ? 'Enabled' : 'Disabled');
        renderSection('users');
    };
    window.deleteAccount = async (id) => {
        if (!confirm('⚠️ Delete this account permanently?')) return;
        try {
            const ordersSnap = await getDocs(collection(db, "users", id, "orders"));
            for (const docSnap of ordersSnap.docs) await deleteDoc(doc(db, "users", id, "orders", docSnap.id));
            const rechargeSnap = await getDocs(query(collection(db, "rechargeRequests"), where("userId", "==", id)));
            for (const docSnap of rechargeSnap.docs) await deleteDoc(doc(db, "rechargeRequests", docSnap.id));
            const withdrawSnap = await getDocs(query(collection(db, "withdrawRequests"), where("userId", "==", id)));
            for (const docSnap of withdrawSnap.docs) await deleteDoc(doc(db, "withdrawRequests", docSnap.id));
            const loanSnap = await getDocs(query(collection(db, "loanRequests"), where("userId", "==", id)));
            for (const docSnap of loanSnap.docs) await deleteDoc(doc(db, "loanRequests", docSnap.id));
            const injSnap = await getDocs(query(collection(db, "injections"), where("userId", "==", id)));
            for (const docSnap of injSnap.docs) await deleteDoc(doc(db, "injections", docSnap.id));
            await deleteDoc(doc(db, "users", id));
            toast('✅ Account deleted');
            renderSection('users');
        } catch(e) { toast('Error: '+e.message, true); }
    };

    // ---- CHAT ----
    function renderChat(main) {
        const customers = cachedData.users.filter(u => u.role !== 'admin' && u.role !== 'agency' && !u.disabled);
        main.innerHTML = `
            <div class="admin-card">
                <h2 style="color:#d4af37;">💬 Customer Service Chat</h2>
                <select class="input-glass" id="chatSelect" style="margin-bottom:8px;">
                    <option value="">-- Select Customer --</option>
                    ${customers.map(u => `<option value="${esc(u.username)}">${esc(u.username)} (${u.email||''})</option>`).join('')}
                </select>
                <div class="chat-container">
                    <div class="chat-messages" id="adminChatMessages"></div>
                    <div class="chat-input-area">
                        <input type="text" class="input-glass" id="adminChatInput" placeholder="Type message..." style="margin-bottom:0;flex:1;">
                        <button class="btn-admin" id="adminSendBtn">Send</button>
                    </div>
                </div>
            </div>
        `;
        let chatUnsub = null;
        document.getElementById('chatSelect').onchange = function() {
            const chatUser = this.value;
            if (chatUnsub) { chatUnsub(); chatUnsub = null; }
            const container = document.getElementById('adminChatMessages');
            if (!chatUser) { container.innerHTML = '<div style="text-align:center;padding:20px;color:#94a3b8;">Select a customer</div>'; return; }
            container.innerHTML = '<div style="text-align:center;padding:20px;color:#94a3b8;">Loading...</div>';
            const q = query(collection(db,'chatMessages'), orderBy('id','asc'));
            chatUnsub = onSnapshot(q, (snap) => {
                if (!container || !chatUser) return;
                const msgs = [];
                snap.forEach(d => {
                    const m = d.data();
                    if (m.type !== 'notification' && ((m.from === chatUser && m.to === 'admin') || (m.from === 'admin' && m.to === chatUser))) {
                        msgs.push(m);
                    }
                });
                msgs.sort((a,b) => a.id - b.id);
                container.innerHTML = msgs.length ? msgs.map(m => `
                    <div class="chat-message ${m.from === 'admin' ? 'sent' : 'received'}">
                        <div>${esc(m.text||'')}</div>
                        ${m.image ? `<img src="${m.image}" class="chat-image" onclick="window.open(this.src)">` : ''}
                        <div class="chat-time">${m.time ? new Date(m.time).toLocaleString([], { hour12: false }) : ''}</div>
                    </div>
                `).join('') : '<div style="text-align:center;padding:20px;color:#94a3b8;">No messages</div>';
                container.scrollTop = container.scrollHeight;
            });
        };
        document.getElementById('adminSendBtn').onclick = async () => {
            const input = document.getElementById('adminChatInput');
            const text = input.value.trim();
            const chatUser = document.getElementById('chatSelect').value;
            if (!text || !chatUser) { if (!chatUser) toast('Select customer', true); return; }
            await setDoc(doc(db,'chatMessages',(Date.now()+Math.random()).toString()), {
                id: Date.now()+Math.random(),
                from: 'admin',
                to: chatUser,
                text: text,
                image: null,
                time: new Date().toISOString(),
                read: false,
                type: 'message'
            });
            input.value = '';
            input.focus();
        };
        document.getElementById('adminChatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('adminSendBtn').click();
        });
        window.__chatUnsub = chatUnsub;
    }

                    cachedData.users = [];
                    snap.forEach(d => cachedData.users.push({ id:d.id, ...d.data() }));
                    const total = cachedData.users.filter(u => u.role !== 'admin' && u.role !== 'agency').length;
                    document.getElementById('memberCount')?.textContent = total;
                    if (['dashboard','users','vip','injection'].includes(currentSection)) {
                        renderSection(currentSection);
                    }
                    const ind = document.getElementById('realTimeIndicator');
                    if (ind) { ind.style.display = 'flex'; setTimeout(() => { if(ind) ind.style.display = 'none'; }, 1200); }
                });
            }
            const saved = localStorage.getItem('adminSection');
            renderSection(saved || 'dashboard');
        })();
    } else {
        document.getElementById('adminLoginScreen').style.display = 'flex';
        document.getElementById('adminPanel').style.display = 'none';
    }

    console.log('✅ LUXCY Admin Panel loaded');
</script>
</body>
</html>
